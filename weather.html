<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Weather</title>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js">
    </script>
    <style>
        /* ── Reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b1a2a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }

        .weather-dashboard {
            border-radius: 24px;
            padding: 12px 16px 20px;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            height: 98vh;
            max-height: 98vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0b4a8a 0%, #2d7fc0 60%, #6bb3e8 100%);
            transition: background 1.2s ease;
            color: #fff;
            position: relative;
        }

        /* ── Scrollbar for lower part ── */
        .scrollable-content::-webkit-scrollbar {
            width: 5px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin: 10px 0;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }
        .scrollable-content::-webkit-scrollbar-button {
            display: none;
        }
        .scrollable-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.35) rgba(255, 255, 255, 0.08);
        }

        /* ── Sticky header (upper part) ── */
        .sticky-header {
            flex-shrink: 0;
            padding: 0 0 8px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 8px;
            position: relative;
            z-index: 10;
            background: transparent;
            border: none;
        }
        .sticky-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), rgba(255, 100, 100, 0.3), transparent);
            border-radius: 2px;
        }

        /* ── Merged display: canvas + temperature ── */
        #merged-display {
            position: relative;
            height: 5cm;
            width: 100%;
            background: transparent;
            margin: 2px 0 4px 0;
            border-radius: 20px;
            overflow: hidden;
            pointer-events: none;
        }
        #merged-display>* {
            pointer-events: none;
        }
        #merged-display #widget-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
            pointer-events: none;
            overflow: hidden;
            border-radius: 20px;
        }
        #merged-display #widget-canvas canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            border-radius: 20px;
            pointer-events: none;
        }
        #merged-display #widget-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }
        #merged-display #widget-header .widget-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #merged-display #widget-header .weather-header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-align: center;
            padding: 0 10px;
            width: 100%;
            pointer-events: none;
        }
        #merged-display #widget-header .weather-header-row .weather-icon-header {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 2px;
        }
        #merged-display #widget-header .weather-header-row .location-datetime {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        #merged-display #widget-header .weather-header-row .location-datetime .loc-name {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
        }
        #merged-display #widget-header .weather-header-row .location-datetime .loc-date {
            font-size: 0.65rem;
            opacity: 0.7;
            line-height: 1.2;
        }
        #merged-display #widget-header .weather-header-row .temp-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2px;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-value {
            font-size: 3.8rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-condition {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow {
            font-size: 0.7rem;
            opacity: 0.7;
            display: inline-flex;
            gap: 6px;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow .max {
            color: #fbbf24;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow .min {
            color: #93c5fd;
        }

        /* ── Scrollable content (lower part) ── */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-right: 4px;
            padding-bottom: 10px;
        }

        /* ── Details grid ── */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0;
        }
        .detail-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .detail-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 0.4px;
        }
        .detail-card .value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1px;
        }
        .detail-card .sub {
            font-size: 0.65rem;
            opacity: 0.6;
        }

        /* ── Sections ── */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            opacity: 0.85;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 4px;
        }
        .hourly-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
            -webkit-overflow-scrolling: touch;
            align-items: stretch;
        }
        .hourly-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .hourly-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }
        .hourly-scroll::-webkit-scrollbar-button {
            display: none;
        }
        .hourly-item {
            flex: 0 0 62px;
            text-align: center;
            font-size: 0.75rem;
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px 2px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .hourly-item .hour {
            opacity: 0.6;
            font-size: 0.6rem;
        }
        .hourly-item .icon {
            font-size: 1.4rem;
            margin: 1px 0;
        }
        .hourly-item .icon i {
            font-size: 1.4rem;
        }
        .hourly-item .temp {
            font-weight: 600;
            font-size: 0.75rem;
        }
        .hourly-item .extra {
            font-size: 0.5rem;
            opacity: 0.7;
            display: block;
            margin-top: 1px;
        }

        /* ── Sunrise / Sunset markers in hourly ── */
        .hourly-marker {
            flex: 0 0 52px;
            text-align: center;
            font-size: 0.6rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 4px 2px;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.05);
        }
        .hourly-marker .marker-icon {
            font-size: 1.4rem;
            line-height: 1.2;
        }
        .hourly-marker .marker-time {
            font-size: 0.6rem;
            opacity: 0.9;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }
        .hourly-marker.sunrise-marker {
            border-color: rgba(255, 215, 0, 0.4);
            background: rgba(255, 215, 0, 0.12);
        }
        .hourly-marker.sunrise-marker .marker-icon {
            color: #fbbf24;
        }
        .hourly-marker.sunset-marker {
            border-color: rgba(255, 100, 50, 0.4);
            background: rgba(255, 100, 50, 0.12);
        }
        .hourly-marker.sunset-marker .marker-icon {
            color: #f97316;
        }

        /* ── Daily ── */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 2px;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
            gap: 4px;
        }
        .daily-row:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .daily-row .day {
            font-weight: 500;
            font-size: 0.8rem;
            width: 70px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .daily-row .icon {
            font-size: 1.4rem;
            width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .daily-row .icon i {
            font-size: 1.4rem;
        }
        .daily-row .temps {
            font-weight: 500;
            font-size: 0.85rem;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .daily-row .temps .max {
            color: #fbbf24;
        }
        .daily-row .temps .min {
            color: #93c5fd;
            margin-left: 6px;
        }
        .daily-row .precip {
            font-size: 0.65rem;
            opacity: 0.6;
            width: 48px;
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* ── NEW ROW: separate blocks for sunrise, watch, sunset ── */
        .watch-row {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            padding: 14px 16px;
            min-height: 160px;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 18px;
            border: 1px solid rgba(255, 255, 255, 0.06);
            overflow: visible; /* Allow sun to overflow */
        }

        .sunrise-block,
        .sunset-block {
            flex: 0 0 auto;
            width: 78px;
            height: 150px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 8px 6px;
            border-radius: 14px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: background 0.3s;
            z-index: 2;
            position: relative; /* for stacking */
        }
        .sunrise-block .side-icon,
        .sunset-block .side-icon {
            font-size: 2.8rem;
            line-height: 1.2;
            margin-bottom: 4px;
        }
        .sunrise-block .side-label,
        .sunset-block .side-label {
            font-size: 0.7rem;
            text-transform: uppercase;
            opacity: 0.5;
            letter-spacing: 0.6px;
            font-weight: 500;
        }
        .sunrise-block .side-time,
        .sunset-block .side-time {
            font-size: 1.0rem;
            font-weight: 600;
            line-height: 1.3;
            margin-top: 2px;
            letter-spacing: 0.3px;
        }
        .sunrise-block .side-time {
            color: #fbbf24;
        }
        .sunset-block .side-time {
            color: #f97316;
        }

        .watch-block {
            flex: 0 0 auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 2;
            position: relative;
        }

        .watch-center {
            cursor: pointer;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.15s ease;
        }
        .watch-center:active {
            transform: scale(0.96);
        }

        /* ── Watch face: SQUARE with rounded corners ── */
        .watch-face {
            position: relative;
            width: 150px;
            height: 150px;
            border-radius: 18px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 16px;
            transition: all 0.6s cubic-bezier(0.23, 1, 0.32, 1);
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.35), inset 0 1px 0 rgba(255, 255, 255, 0.10);
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
            overflow: hidden;
        }
        .watch-face::before {
            content: '';
            position: absolute;
            inset: 4px;
            border-radius: 14px;
            border: 2px solid rgba(255, 255, 255, 0.06);
            pointer-events: none;
            z-index: 2;
        }
        .watch-face::after {
            content: '';
            position: absolute;
            inset: 8px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.04);
            pointer-events: none;
            z-index: 2;
        }

        .watch-face .ring-glow {
            position: absolute;
            inset: -2px;
            border-radius: 18px;
            pointer-events: none;
            z-index: 1;
            opacity: 0.3;
            transition: opacity 0.6s;
        }

        .watch-content {
            position: relative;
            z-index: 3;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
            text-align: center;
            gap: 1px;
        }

        .watch-day {
            font-size: 0.7rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
            opacity: 0.75;
            margin-bottom: 1px;
            line-height: 1.2;
        }

        .watch-time-row {
            display: flex;
            align-items: baseline;
            justify-content: center;
            gap: 1px;
            line-height: 1;
            margin: 0;
        }
        .watch-hours {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .watch-colon {
            font-size: 2.4rem;
            font-weight: 200;
            opacity: 0.6;
            line-height: 1;
            margin: 0 1px;
        }
        .watch-minutes {
            font-size: 2.6rem;
            font-weight: 300;
            letter-spacing: 1px;
            line-height: 1;
            font-variant-numeric: tabular-nums;
        }
        .watch-seconds {
            font-size: 1.1rem;
            font-weight: 300;
            opacity: 0.45;
            line-height: 1;
            margin-left: 4px;
            letter-spacing: 0.5px;
            font-variant-numeric: tabular-nums;
        }

        .watch-date {
            font-size: 0.6rem;
            font-weight: 500;
            letter-spacing: 1.5px;
            opacity: 0.7;
            margin-top: 1px;
            line-height: 1.2;
        }

        .watch-brand {
            font-size: 0.5rem;
            font-weight: 600;
            letter-spacing: 2.5px;
            opacity: 0.4;
            margin-top: 2px;
            line-height: 1.2;
        }

        /* ── Theme: Rado ── */
        .theme-rado {
            background: radial-gradient(ellipse at 30% 25%, #3a3a3a, #111111 70%, #000000);
            border: 2px solid #a0a0a0;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(160, 160, 160, 0.06), 0 0 30px rgba(160, 160, 160, 0.04);
        }
        .theme-rado .ring-glow {
            background: radial-gradient(ellipse at 50% 50%, rgba(200, 200, 200, 0.15), transparent 70%);
        }
        .theme-rado .watch-day {
            color: #d0d0d0;
        }
        .theme-rado .watch-hours,
        .theme-rado .watch-minutes,
        .theme-rado .watch-colon {
            color: #f0f0f0;
        }
        .theme-rado .watch-seconds {
            color: #b0b0b0;
        }
        .theme-rado .watch-date {
            color: #c0c0c0;
        }
        .theme-rado .watch-brand {
            color: #a0a0a0;
            letter-spacing: 3px;
        }
        .theme-rado .watch-brand::before {
            content: '◆ ';
            opacity: 0.5;
        }
        .theme-rado .watch-brand::after {
            content: ' ◆';
            opacity: 0.5;
        }

        /* ── Theme: Omega ── */
        .theme-omega {
            background: radial-gradient(ellipse at 35% 30%, #1a3a6a, #0a1a3a 60%, #050d1a);
            border: 2px solid #d4a843;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(212, 168, 67, 0.08), 0 0 30px rgba(212, 168, 67, 0.06);
        }
        .theme-omega .ring-glow {
            background: radial-gradient(ellipse at 50% 50%, rgba(212, 168, 67, 0.12), transparent 70%);
        }
        .theme-omega .watch-day {
            color: #d4c8a0;
        }
        .theme-omega .watch-hours,
        .theme-omega .watch-minutes,
        .theme-omega .watch-colon {
            color: #f0e8d0;
        }
        .theme-omega .watch-seconds {
            color: #b0a888;
        }
        .theme-omega .watch-date {
            color: #c8b898;
        }
        .theme-omega .watch-brand {
            color: #d4a843;
            letter-spacing: 3px;
        }
        .theme-omega .watch-brand::before {
            content: '✦ ';
            opacity: 0.6;
        }
        .theme-omega .watch-brand::after {
            content: ' ✦';
            opacity: 0.6;
        }

        /* ── Theme: Patek Philippe ── */
        .theme-patek {
            background: radial-gradient(ellipse at 40% 30%, #f5efe6, #e8ddd0 55%, #d5c8b8);
            border: 2px solid #d4a09b;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.3), inset 0 0 60px rgba(212, 160, 155, 0.08), 0 0 30px rgba(212, 160, 155, 0.05);
        }
        .theme-patek .ring-glow {
            background: radial-gradient(ellipse at 50% 50%, rgba(212, 160, 155, 0.10), transparent 70%);
        }
        .theme-patek .watch-day {
            color: #5a4a3a;
        }
        .theme-patek .watch-hours,
        .theme-patek .watch-minutes,
        .theme-patek .watch-colon {
            color: #3a2a1a;
        }
        .theme-patek .watch-seconds {
            color: #8a7a6a;
        }
        .theme-patek .watch-date {
            color: #6a5a4a;
        }
        .theme-patek .watch-brand {
            color: #d4a09b;
            letter-spacing: 2.5px;
        }
        .theme-patek .watch-brand::before {
            content: '◈ ';
            opacity: 0.5;
        }
        .theme-patek .watch-brand::after {
            content: ' ◈';
            opacity: 0.5;
        }

        /* ── Theme: Rolex ── */
        .theme-rolex {
            background: radial-gradient(ellipse at 30% 25%, #1a4a2a, #0d2818 60%, #06120a);
            border: 2px solid #c9a84c;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(201, 168, 76, 0.08), 0 0 30px rgba(201, 168, 76, 0.06);
        }
        .theme-rolex .ring-glow {
            background: radial-gradient(ellipse at 50% 50%, rgba(201, 168, 76, 0.12), transparent 70%);
        }
        .theme-rolex .watch-day {
            color: #c9b888;
        }
        .theme-rolex .watch-hours,
        .theme-rolex .watch-minutes,
        .theme-rolex .watch-colon {
            color: #e8ddc0;
        }
        .theme-rolex .watch-seconds {
            color: #a89870;
        }
        .theme-rolex .watch-date {
            color: #b8a880;
        }
        .theme-rolex .watch-brand {
            color: #c9a84c;
            letter-spacing: 3px;
        }
        .theme-rolex .watch-brand::before {
            content: '◉ ';
            opacity: 0.5;
        }
        .theme-rolex .watch-brand::after {
            content: ' ◉';
            opacity: 0.5;
        }

        /* ── Theme: TAG Heuer ── */
        .theme-tag {
            background: radial-gradient(ellipse at 30% 25%, #2a2a2a, #0a0a0a 60%, #000000);
            border: 2px solid #e62424;
            box-shadow: 0 8px 40px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(230, 36, 36, 0.06), 0 0 30px rgba(230, 36, 36, 0.05);
        }
        .theme-tag .ring-glow {
            background: radial-gradient(ellipse at 50% 50%, rgba(230, 36, 36, 0.08), transparent 70%);
        }
        .theme-tag .watch-day {
            color: #d0d0d0;
        }
        .theme-tag .watch-hours,
        .theme-tag .watch-minutes,
        .theme-tag .watch-colon {
            color: #f0f0f0;
        }
        .theme-tag .watch-seconds {
            color: #e62424;
            opacity: 0.6;
        }
        .theme-tag .watch-date {
            color: #b0b0b0;
        }
        .theme-tag .watch-brand {
            color: #e62424;
            letter-spacing: 3px;
        }
        .theme-tag .watch-brand::before {
            content: '◆ ';
            opacity: 0.6;
        }
        .theme-tag .watch-brand::after {
            content: ' ◆';
            opacity: 0.6;
        }

        /* ── Watch theme indicator dots ── */
        .watch-theme-dots {
            display: flex;
            justify-content: center;
            gap: 6px;
            padding: 6px 0 4px;
            opacity: 0.6;
            position: relative;
            z-index: 2;
            margin-top: 4px;
        }
        .watch-theme-dots .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.2);
            transition: all 0.3s;
            border: none;
            padding: 0;
            cursor: pointer;
        }
        .watch-theme-dots .dot.active {
            background: rgba(255, 255, 255, 0.85);
            transform: scale(1.3);

        /* ── Sun Animation ── */
        .sun-track {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;

            z-index: 10; /* Above blocks (z-index: 2) */

                <div id="widget-canvas">
                    <div class="widget-content">
                        <canvas id="weather-canvas"></canvas>
                    </div>

                <div id="widget-header">

        <!-- ─── SCROLLABLE CONTENT (LOWER PART) ─── -->

        function getWeatherInfo(code, isDay) {
            const w = weatherIcons[code] || { day: '🌡️', night: '🌡️', desc: 'Unknown' };
            return { icon: isDay ? w.day : w.night, desc: w.desc };
        }

        function getWindDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        function getWeatherCategory(code) {
            if (code === 0 || code === 1) return 'clear';
            if (code === 2 || code === 3) return 'clouds';
            if ((code >= 45 && code <= 48)) return 'fog';
            if ((code >= 51 && code <= 57) || (code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
            if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return 'snow';
            if (code >= 95 && code <= 99) return 'thunderstorm';
            return 'clear';
        }

        function getRainIntensity(code) {
            if (code >= 51 && code <= 57) return 'drizzle';
            if (code === 61 || code === 80) return 'light';
            if (code === 63 || code === 81) return 'moderate';
            if (code === 65 || code === 82) return 'heavy';
            if (code >= 95 && code <= 99) return 'storm';
            return 'moderate';
        }

        function getTimeOfDay(sunrise, sunset, now) {
            const dawnStart = new Date(sunrise.getTime() - 30 * 60000);
            const dawnEnd = new Date(sunrise.getTime() + 30 * 60000);
            const duskStart = new Date(sunset.getTime() - 30 * 60000);
            const duskEnd = new Date(sunset.getTime() + 30 * 60000);
            if (now >= dawnStart && now <= dawnEnd) return 'dawn';
            if (now >= duskStart && now <= duskEnd) return 'dusk';
            if (now > sunrise && now < sunset) return 'day';
            return 'night';
        }

        // ─── API ─────────────────────────────────────────────────────────────
        function fetchWeatherData(lat, lon) {
            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,windspeed_10m_max&hourly=temperature_2m,weather_code,precipitation_probability&timezone=auto&temperature_unit=celsius&windspeed_unit=kmh&precipitation_unit=mm&forecast_days=10`;
            return fetch(url).then(r => { if (!r.ok) throw new Error('Weather API error'); return r.json(); });
        }

        async function fetchLocationName(lat, lon) {
            try {
                const url =
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=en`;
                const res = await fetch(url, { headers: { 'User-Agent': 'WeatherApp/1.0' } });
                if (!res.ok) throw new Error('Nominatim API error');
                const data = await res.json();
                let displayName = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                if (data && data.address) {
                    const addr = data.address;
                    let parts = [];
                    if (addr.suburb) parts.push(addr.suburb);
                    else if (addr.city) parts.push(addr.city);
                    else if (addr.town) parts.push(addr.town);
                    else if (addr.village) parts.push(addr.village);
                    else if (addr.county) parts.push(addr.county);
                    else if (addr.state) parts.push(addr.state);
                    if (addr.country) parts.push(addr.country);
                    if (parts.length > 0) displayName = parts.join(', ');
                    else displayName = data.display_name || displayName;
                }
                displayName = displayName.replace(/\(\d+\.\d+,\s*\d+\.\d+\)/, '').trim();
                return displayName;
            } catch (e) {
                console.warn('Reverse geocoding error:', e);
                return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
            }
        }

        // ─── Stars ──────────────────────────────────────────────────────────
        function createStars(count) {
            document.querySelectorAll('.star').forEach(el => el.remove());
            stars = [];
            const container = document.getElementById('weather-dashboard-container');
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 80 + '%';
                star.style.setProperty('--duration', (1.5 + Math.random() * 3) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                container.appendChild(star);
                stars.push(star);
            }
        }

        function clearStars() {
            document.querySelectorAll('.star').forEach(el => el.remove());
            stars = [];
        }

        // ─── Cloud palette ───────────────────────────────────────────────────
        function getCloudPalette() {
            if (currentWeatherCat === 'thunderstorm') {
                return { lit: '196,199,204', mid: '160,165,176', edge: '112,118,132', outer: '78,84,102', shadow: '18,19,26' };
            }
            switch (currentTimeOfDay) {
                case 'dawn':
                    return { lit: '255,238,220', mid: '250,218,196', edge: '236,193,172', outer: '218,175,158', shadow: '112,82,68' };
                case 'dusk':
                    return { lit: '250,228,236', mid: '233,199,218', edge: '203,164,194', outer: '172,133,168', shadow: '70,46,80' };
                case 'night':
                    return { lit: '205,214,232', mid: '168,181,206', edge: '126,141,172', outer: '96,112,148', shadow: '18,22,42' };
                default:
                    return { lit: '248,252,255', mid: '230,242,253', edge: '215,232,248', outer: '200,220,245', shadow: '75,95,130' };
            }
        }

        function drawPhotorealisticCloud(ctx, x, y, size, opacity, density) {
            const s = size * 0.85;
            const d = 0.3 + density * 0.5;
            const pal = getCloudPalette();
            ctx.save();

            const puffs = [
                { dx: 0, dy: 0, r: s * 0.95, depth: 1.0 },
                { dx: -s * 0.55, dy: s * 0.06, r: s * 0.60, depth: 0.88 },
                { dx: s * 0.50, dy: s * 0.02, r: s * 0.58, depth: 0.92 },
                { dx: -s * 0.35, dy: -s * 0.28, r: s * 0.50, depth: 0.78 },
                { dx: s * 0.38, dy: -s * 0.22, r: s * 0.48, depth: 0.82 },
                { dx: -s * 0.68, dy: s * 0.18, r: s * 0.42, depth: 0.72 },
                { dx: s * 0.65, dy: s * 0.14, r: s * 0.44, depth: 0.74 },
                { dx: 0, dy: -s * 0.38, r: s * 0.46, depth: 0.90 },
                { dx: -s * 0.20, dy: s * 0.26, r: s * 0.38, depth: 0.68 },
                { dx: s * 0.22, dy: s * 0.20, r: s * 0.36, depth: 0.70 },
                { dx: -s * 0.45, dy: -s * 0.12, r: s * 0.32, depth: 0.65 },
                { dx: s * 0.48, dy: -s * 0.08, r: s * 0.30, depth: 0.67 },
                { dx: -s * 0.15, dy: s * 0.40, r: s * 0.28, depth: 0.60 },
                { dx: s * 0.12, dy: s * 0.36, r: s * 0.26, depth: 0.62 },
            ];

            const baseOpacity = opacity * 0.80;

            for (const puff of puffs) {
                const px = x + puff.dx;
                const py = y + puff.dy;
                const pr = puff.r * (0.70 + 0.30 * d);

                const grad = ctx.createRadialGradient(
                    px - pr * 0.20, py - pr * 0.30, pr * 0.08,
                    px, py, pr * 1.35
                );
                const alpha = baseOpacity * puff.depth * (0.70 + 0.30 * (puff.r / s));
                grad.addColorStop(0, `rgba(${pal.lit}, ${alpha * 0.98})`);
                grad.addColorStop(0.20, `rgba(${pal.lit}, ${alpha * 0.90})`);
                grad.addColorStop(0.50, `rgba(${pal.mid}, ${alpha * 0.68})`);
                grad.addColorStop(0.78, `rgba(${pal.edge}, ${alpha * 0.38})`);
                grad.addColorStop(1, `rgba(${pal.outer}, 0)`);

                ctx.beginPath();
                ctx.ellipse(px, py, pr * 0.98, pr * 0.58, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                const hlGrad = ctx.createRadialGradient(
                    px - pr * 0.20, py - pr * 0.32, 0,
                    px - pr * 0.16, py - pr * 0.26, pr * 0.50
                );
                hlGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.50})`);
                hlGrad.addColorStop(0.40, `rgba(255, 255, 255, ${alpha * 0.20})`);
                hlGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                ctx.beginPath();
                ctx.ellipse(px - pr * 0.12, py - pr * 0.24, pr * 0.42, pr * 0.22, -0.20, 0, Math.PI * 2);
                ctx.fillStyle = hlGrad;
                ctx.fill();
            }

            const shadowGrad = ctx.createRadialGradient(
                x - s * 0.08, y + s * 0.20, s * 0.15,
                x, y + s * 0.30, s * 0.95
            );
            shadowGrad.addColorStop(0, `rgba(${pal.shadow}, ${opacity * 0.18})`);
            shadowGrad.addColorStop(0.60, `rgba(${pal.shadow}, ${opacity * 0.06})`);
            shadowGrad.addColorStop(1, `rgba(${pal.shadow}, 0)`);
            ctx.beginPath();
            ctx.ellipse(x, y + s * 0.28, s * 0.80, s * 0.22, 0, 0, Math.PI * 2);
            ctx.fillStyle = shadowGrad;
            ctx.fill();

            ctx.restore();
        }

        function drawRaindrop(ctx, x, y, size, opacity, tilt, elongation, highlight, speed) {
            const len = size * 5.2 * elongation;
            const wid = size * 0.95;
            const angle = tilt + Math.PI / 2 + 0.12;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const alpha = Math.min(opacity, 0.92);

            let r0 = '195, 228, 255',
                r1 = '175, 215, 248',
                r2 = '135, 185, 235',
                r3 = '95, 145, 215';
            if (currentTimeOfDay === 'night') { r0 = '150, 175, 205';
                r1 = '125, 152, 190';
                r2 = '90, 115, 155';
                r3 = '60, 82, 120'; } else if (currentTimeOfDay === 'dawn' || currentTimeOfDay === 'dusk') { r0 =
                    '210, 220, 240';
                r1 = '190, 200, 228';
                r2 = '150, 165, 205';
                r3 = '110, 125, 175'; }

            const grad = ctx.createLinearGradient(0, -len * 0.6, 0, len * 0.4);
            grad.addColorStop(0, `rgba(${r0}, ${alpha * 0.95})`);
            grad.addColorStop(0.35, `rgba(${r1}, ${alpha * 0.85})`);
            grad.addColorStop(0.7, `rgba(${r2}, ${alpha * 0.55})`);
            grad.addColorStop(1, `rgba(${r3}, ${alpha * 0.05})`);

            ctx.beginPath();
            ctx.ellipse(0, 0, wid, len, 0, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            const hlGrad = ctx.createLinearGradient(-wid * 0.6, -len * 0.65, wid * 0.4, -len * 0.2);
            hlGrad.addColorStop(0, `rgba(255, 255, 255, ${0.75 * highlight})`);
            hlGrad.addColorStop(0.4, `rgba(255, 255, 255, ${0.35 * highlight})`);
            hlGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
            ctx.beginPath();
            ctx.ellipse(-wid * 0.25, -len * 0.42, wid * 0.55, len * 0.38, 0, 0, Math.PI * 2);
            ctx.fillStyle = hlGrad;
            ctx.fill();

            ctx.strokeStyle = `rgba(225, 245, 255, ${alpha * 0.45})`;
            ctx.lineWidth = wid * 0.6;
            ctx.beginPath();
            ctx.moveTo(0, -len * 0.85);
            ctx.lineTo(0, len * 0.1);
            ctx.stroke();

            ctx.restore();

            if (speed > 3.5) {
                ctx.save();
                ctx.globalAlpha = alpha * 0.18;
                ctx.translate(x - Math.sin(angle) * speed * 0.65, y + Math.cos(angle) * speed * 0.55);
                ctx.rotate(angle);
                ctx.fillStyle = `rgba(185, 225, 255, 0.25)`;
                ctx.beginPath();
                ctx.ellipse(0, len * 0.6, wid * 0.45, len * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawSnowflake(ctx, x, y, size, opacity) {
            const r = size * 0.92;
            ctx.save();

            let s0 = '245, 252, 255',
                s1 = '255, 255, 255',
                s2 = '250, 252, 255',
                s3 = '235, 245, 255',
                s4 = '220, 235, 250';
            if (currentTimeOfDay === 'night') { s0 = '210, 222, 245';
                s1 = '225, 235, 255';
                s2 = '205, 218, 245';
                s3 = '178, 195, 230';
                s4 = '150, 170, 210'; } else if (currentTimeOfDay === 'dawn' || currentTimeOfDay === 'dusk') { s0 =
                    '250, 240, 245';
                s1 = '255, 250, 250';
                s2 = '250, 238, 240';
                s3 = '240, 220, 228';
                s4 = '225, 200, 212'; }

            const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5);
            glow.addColorStop(0, `rgba(${s0}, ${opacity * 0.28})`);
            glow.addColorStop(1, `rgba(${s3}, 0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, r * 3.5, 0, Math.PI * 2);
            ctx.fill();

            const grad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.28, r * 0.15, x, y, r * 1.05);
            grad.addColorStop(0, `rgba(${s1}, ${opacity * 0.98})`);
            grad.addColorStop(0.45, `rgba(${s2}, ${opacity * 0.82})`);
            grad.addColorStop(0.75, `rgba(${s3}, ${opacity * 0.55})`);
            grad.addColorStop(1, `rgba(${s4}, ${opacity * 0.25})`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(${s0}, ${opacity * 0.75})`;
            ctx.lineWidth = Math.max(0.7, r * 0.085);
            ctx.lineCap = "round";

            for (let i = 0; i < 6; i++) {
                const a = i * (Math.PI / 3) + Date.now() * 0.00028;
                const armLen = r * 0.92;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(a) * armLen, y + Math.sin(a) * armLen);
                ctx.stroke();

                const b1 = a + 0.45;
                const b2 = a - 0.45;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * armLen * 0.55, y + Math.sin(a) * armLen * 0.55);
                ctx.lineTo(x + Math.cos(a) * armLen * 0.55 + Math.cos(b1) * armLen * 0.38, y + Math.sin(a) * armLen * 0.55 +
                    Math.sin(b1) * armLen * 0.38);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * armLen * 0.55, y + Math.sin(a) * armLen * 0.55);
                ctx.lineTo(x + Math.cos(a) * armLen * 0.55 + Math.cos(b2) * armLen * 0.38, y + Math.sin(a) * armLen * 0.55 +
                    Math.sin(b2) * armLen * 0.38);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFog(ctx, x, y, size, opacity) {
            const w = size * 1.65;
            const h = size * 0.72;
            ctx.save();

            let c0 = '235, 245, 255',
                c1 = '225, 238, 252',
                c2 = '210, 225, 245',
                c3 = '190, 210, 235';
            if (currentTimeOfDay === 'dawn') { c0 = '250, 235, 220';
                c1 = '244, 222, 205';
                c2 = '228, 205, 195';
                c3 = '205, 185, 180'; } else if (currentTimeOfDay === 'dusk') { c0 = '235, 220, 230';
                c1 = '218, 202, 220';
                c2 = '196, 182, 205';
                c3 = '170, 158, 190'; } else if (currentTimeOfDay === 'night') { c0 = '190, 200, 215';
                c1 = '160, 172, 195';
                c2 = '125, 138, 165';
                c3 = '95, 108, 140'; }

            const grad = ctx.createRadialGradient(x, y - size * 0.15, size * 0.3, x, y, size * 1.4);
            grad.addColorStop(0, `rgba(${c0}, ${opacity * 1.35})`);
            grad.addColorStop(0.4, `rgba(${c1}, ${opacity * 0.95})`);
            grad.addColorStop(0.75, `rgba(${c2}, ${opacity * 0.55})`);
            grad.addColorStop(1, `rgba(${c3}, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(x, y, w, h, 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = opacity * 0.45;
            ctx.beginPath();
            ctx.ellipse(x + size * 0.2, y - size * 0.1, w * 0.75, h * 0.65, -0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ─── Particle engine ──────────────────────────────────────────────────
        function buildParticles(weatherCode, windSpeed, timeOfDay) {
            const s = settings;
            const cat = getWeatherCategory(weatherCode);
            const intensity = getRainIntensity(weatherCode);
            const windFactor = Math.min(windSpeed / 15, 2.5);

            let particleCount = 0;
            let type = 'none';
            let speedBase = 0,
                speedRange = 0,
                sizeBase = 0,
                sizeRange = 0,
                opacityBase = 0,
                opacityRange = 0;
            let isDrizzle = false;

            if (cat === 'rain') {
                type = 'rain';
                const freqMul = 0.5 + s.rainFreq * 1.0;
                const sizeMul = 0.5 + s.rainSize * 1.0;
                const speedMul = 0.5 + s.rainSpeed * 0.8;
                switch (intensity) {
                    case 'drizzle':
                        particleCount = Math.round(120 * freqMul);
                        speedBase = 0.85 * speedMul;
                        speedRange = 0.75;
                        sizeBase = 0.30 * sizeMul;
                        sizeRange = 0.30 * sizeMul;
                        opacityBase = 0.28;
                        opacityRange = 0.22;
                        isDrizzle = true;
                        break;
                    case 'light':
                        particleCount = Math.round(180 * freqMul);
                        speedBase = 2.8 * speedMul;
                        speedRange = 1.6;
                        sizeBase = 0.55 * sizeMul;
                        sizeRange = 0.55 * sizeMul;
                        opacityBase = 0.38;
                        opacityRange = 0.32;
                        break;
                    case 'moderate':
                        particleCount = Math.round(280 * freqMul);
                        speedBase = 4.8 * speedMul;
                        speedRange = 2.1;
                        sizeBase = 0.75 * sizeMul;
                        sizeRange = 0.75 * sizeMul;
                        opacityBase = 0.43;
                        opacityRange = 0.36;
                        break;
                    case 'heavy':
                        particleCount = Math.round(420 * freqMul);
                        speedBase = 7.4 * speedMul;
                        speedRange = 3.2;
                        sizeBase = 0.95 * sizeMul;
                        sizeRange = 0.95 * sizeMul;
                        opacityBase = 0.48;
                        opacityRange = 0.42;
                        break;
                    case 'storm':
                        particleCount = Math.round(520 * freqMul);
                        speedBase = 9.4 * speedMul;
                        speedRange = 4.6;
                        sizeBase = 1.10 * sizeMul;
                        sizeRange = 1.10 * sizeMul;
                        opacityBase = 0.52;
                        opacityRange = 0.41;
                        break;
                    default:
                        particleCount = Math.round(220 * freqMul);
                        speedBase = 3.7 * speedMul;
                        speedRange = 2.1;
                        sizeBase = 0.70 * sizeMul;
                        sizeRange = 0.70 * sizeMul;
                        opacityBase = 0.38;
                        opacityRange = 0.36;
                }
                speedBase += windFactor * 0.18;
            } else if (cat === 'snow') {
                type = 'snow';
                const sizeMul = 0.5 + s.snowSize * 1.0;
                const densityMul = 0.5 + s.snowDensity * 1.0;
                const speedMul = 0.5 + s.snowSpeed * 0.8;
                const wobbleMul = 0.2 + s.snowWobble * 1.2;
                const isHeavy = weatherCode >= 75 || weatherCode >= 86;
                particleCount = Math.round((isHeavy ? 380 : 210) * densityMul);
                speedBase = (isHeavy ? 1.65 : 0.75) * speedMul;
                speedRange = (isHeavy ? 1.45 : 1.05) * speedMul;
                sizeBase = (isHeavy ? 3.6 : 2.1) * sizeMul;
                sizeRange = (isHeavy ? 3.6 : 2.6) * sizeMul;
                opacityBase = 0.55 + 0.2 * densityMul;
                opacityRange = 0.38;
            } else if (cat === 'fog') {
                type = 'fog';
                const densityMul = 0.5 + s.fogDensity * 1.0;
                const sizeMul = 0.5 + s.fogSize * 1.0;
                particleCount = Math.round(85 * densityMul);
                speedBase = 0.09;
                speedRange = 0.13;
                sizeBase = 32 * sizeMul;
                sizeRange = 55 * sizeMul;
                opacityBase = 0.065 * densityMul;
                opacityRange = 0.11 * densityMul;
            } else if (cat === 'clouds') {
                type = 'cloud';
                const density = 0.3 + s.cloudDensity * 0.7;
                const size = 0.3 + s.cloudSize * 0.5;
                const speed = 0.2 + s.cloudSpeed * 0.4;
                const opacity = 0.5 + s.cloudOpacity * 0.5;
                particleCount = Math.round(25 * density + 10);
                speedBase = 0.008;
                speedRange = 0.012;
                sizeBase = 150 * size;
                sizeRange = 10 * size;
                opacityBase = opacity;
                opacityRange = opacity * 0.25;
            } else if (cat === 'thunderstorm') {
                type = 'thunder';
                const freqMul = 0.5 + s.thunderRainFreq * 1.0;
                const sizeMul = 0.5 + s.thunderRainSize * 1.0;
                const thunderMul = 0.5 + s.thunderIntensity * 1.0;
                const lightningMul = 0.5 + s.lightningFreq * 1.0;
                particleCount = Math.round(460 * freqMul);
                speedBase = 8.4 + thunderMul * 2.1;
                speedRange = 4.3 + thunderMul * 1.6;
                sizeBase = 1.10 * sizeMul;
                sizeRange = 1.10 * sizeMul;
                opacityBase = 0.51;
                opacityRange = 0.41;
            } else if (cat === 'clear' && timeOfDay === 'night') {
                type = 'clear-night';
                particleCount = 32;
                speedBase = 0.022;
                speedRange = 0.038;
                sizeBase = 1.05;
                sizeRange = 1.55;
                opacityBase = 0.32;
                opacityRange = 0.48;
            } else {
                type = 'none';
                particleCount = 0;
            }

            const particles = [];
            for (let i = 0; i < particleCount; i++) {
                const p = {
                    x: Math.random() * 640,
                    y: Math.random() * 360,
                    speed: speedBase + (Math.random() - 0.5) * speedRange * 2,
                    size: sizeBase + Math.random() * sizeRange,
                    opacity: opacityBase + Math.random() * opacityRange,
                    wind: (0.2 + Math.random() * 0.6) * windFactor + 0.2,
                    type: type,
                    wobble: 0,
                    wobbleSpeed: 0.005 + Math.random() * 0.015,
                    phase: Math.random() * Math.PI * 2,
                    tilt: -0.1 + Math.random() * 0.2,
                    elongation: 0.01 + Math.random() * 0.4,
                    highlight: 0.3 + Math.random() * 0.5,
                    density: 0.5 + Math.random() * 0.5,
                };
                if (isDrizzle) {
                    p.speed = 0.42 + Math.random() * 0.58;
                    p.size = 0.32 + Math.random() * 0.48;
                    p.opacity = 0.22 + Math.random() * 0.18;
                    p.elongation = 0.42 + Math.random() * 0.28;
                }
                if (type === 'snow') {
                    const wobbleMul = 0.2 + settings.snowWobble * 1.2;
                    p.wobble = (0.2 + Math.random() * 1.2) * wobbleMul;
                    p.wobbleSpeed = 0.003 + Math.random() * 0.015;
                    p.phase = Math.random() * Math.PI * 2;
                    p.size = sizeBase + Math.random() * sizeRange * 0.82;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = (0.1 + Math.random() * 0.5) * windFactor + 0.1;
                }
                if (type === 'fog') {
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.speed = speedBase + Math.random() * speedRange;
                    p.wind = (0.03 + Math.random() * 0.1) * windFactor + 0.03;
                }
                if (type === 'cloud') {
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.speed = speedBase + Math.random() * speedRange;
                    p.wind = 0.2 + (s.cloudSpeed * 0.15) + Math.random() * 0.15;
                    p.y = Math.random() * 360 * 0.7 + 20;
                    p.density = 0.3 + Math.random() * 0.5;
                }
                if (type === 'thunder') {
                    p.speed = speedBase + (Math.random() - 0.5) * speedRange * 2;
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = (0.2 + Math.random() * 0.5) * windFactor + 0.2;
                }
                if (type === 'clear-night') {
                    p.speed = speedBase + (Math.random() - 0.5) * speedRange * 2;
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = 0.02 + Math.random() * 0.03;
                }
                particles.push(p);
            }
            return { particles, type, cat, intensity };
        }

        // ─── Lightning with branching ──────────────────────────────────────
        function generateLightningBolt(W, H, branches = 3) {
            const points = [];
            let x = W * (0.2 + Math.random() * 0.6);
            let y = 0;
            const endY = H * (0.5 + Math.random() * 0.4);
            points.push([x, y]);
            const segments = 8 + Math.floor(Math.random() * 5);
            for (let i = 1; i <= segments; i++) {
                y = (endY / segments) * i;
                x += (Math.random() - 0.5) * W * 0.12;
                points.push([x, y]);
            }
            const branchesList = [];
            for (let b = 0; b < branches; b++) {
                if (Math.random() < 0.4) continue;
                const startIdx = 2 + Math.floor(Math.random() * (points.length - 3));
                const [sx, sy] = points[startIdx];
                const branchPoints = [
                    [sx, sy],
                    [sx + (Math.random() - 0.5) * W * 0.08, sy + (Math.random() * H * 0.08)],
                    [sx + (Math.random() - 0.5) * W * 0.12, sy + (Math.random() * H * 0.15)]
                ];
                branchesList.push(branchPoints);
            }
            return { main: points, branches: branchesList };
        }

        function runAnimation(canvas, particles, type, weatherCode) {
            const ctx = canvas.getContext('2d');
            const W = canvas.width,
                H = canvas.height;
            let animating = true;
            let flashTimer = 0,
                flashIntensity = 0;
            let boltData = null,
                boltLife = 0;

            const lightningMul = 0.5 + settings.lightningFreq;

            function animate() {
                if (!animating) return;
                ctx.clearRect(0, 0, W, H);

                if (type === 'thunder') {
                    flashTimer += 0.016;
                    const lightningThreshold = Math.max(0.8, 2.2 / lightningMul);
                    if (flashTimer > lightningThreshold + Math.random() * 2.0) {
                        flashIntensity = (0.15 + Math.random() * 0.3);
                        flashTimer = 0;
                        if (Math.random() < 0.5) {
                            const branches = 2 + Math.floor(Math.random() * 4);
                            boltData = generateLightningBolt(W, H, branches);
                            boltLife = 1.0;
                        }
                    }
                    if (boltData && boltLife > 0) {
                        ctx.save();
                        ctx.globalAlpha = boltLife;
                        ctx.shadowColor = 'rgba(200,225,255,0.9)';
                        ctx.shadowBlur = 20;
                        ctx.strokeStyle = 'rgba(235,245,255,0.95)';
                        ctx.lineWidth = 2.5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath();
                        boltData.main.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                        ctx.stroke();
                        for (const branch of boltData.branches) {
                            ctx.beginPath();
                            branch.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 10;
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = 'rgba(210,230,255,0.3)';
                        ctx.beginPath();
                        boltData.main.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                        ctx.stroke();
                        ctx.restore();
                        boltLife *= 0.65;
                        if (boltLife < 0.03) { boltLife = 0;
                            boltData = null; }
                    }
                    if (flashIntensity > 0) {
                        ctx.fillStyle = `rgba(225,235,255,${flashIntensity})`;
                        ctx.fillRect(0, 0, W, H);
                        flashIntensity *= 0.90;
                        if (flashIntensity < 0.002) flashIntensity = 0;
                    }
                }

                for (const p of particles) {
                    p.x += p.wind;
                    p.y += p.speed;
                    if (p.type === 'snow' || p.type === 'clear-night') {
                        p.x += Math.sin(p.phase + Date.now() * 0.001 * p.wobbleSpeed) * p.wobble * 0.32;
                    }
                    const margin = 55;
                    if (p.x > W + margin) p.x = -margin;
                    if (p.x < -margin) p.x = W + margin;
                    if (p.y > H + margin) { p.y = -margin;
                        p.x = Math.random() * W; }
                    if (p.y < -margin) { p.y = H + margin;
                        p.x = Math.random() * W; }

                    if (p.type === 'rain' || p.type === 'thunder') {
                        drawRaindrop(ctx, p.x, p.y, p.size, p.opacity, p.tilt, p.elongation, p.highlight, p.speed);
                    } else if (p.type === 'snow') {
                        drawSnowflake(ctx, p.x, p.y, p.size, p.opacity);
                    } else if (p.type === 'fog') {
                        drawFog(ctx, p.x, p.y, p.size, p.opacity);
                    } else if (p.type === 'cloud') {
                        drawPhotorealisticCloud(ctx, p.x, p.y, p.size, p.opacity, p.density || 0.5);
                    } else if (p.type === 'clear-night') {
                        ctx.save();
                        ctx.shadowColor = 'rgba(255,255,255,0.35)';
                        ctx.shadowBlur = 8;
                        ctx.fillStyle = `rgba(255,255,255,${p.opacity * 0.45})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                }

                requestAnimationFrame(animate);
            }
            animate();

            return function stop() {
                animating = false;
            };
        }

        function startWeatherAnimation(weatherCode, windSpeed, timeOfDay) {
            const canvas = document.getElementById('weather-canvas');
            if (!canvas) return;
            const container = document.getElementById('merged-display');
            const rect = container.getBoundingClientRect();

            currentTimeOfDay = timeOfDay || 'day';

            weatherParticles = result.particles;

            if (currentAnimationCleanup) {
                currentAnimationCleanup();

            const stopFn = runAnimation(canvas, weatherParticles, type, weatherCode);

            if (timeOfDay === 'night') createStars(80);

        }

        // ─── Sun Animation (JavaScript) ──────────────────────────────────────

        let sunAnimationId = null;

        function startSunAnimation() {
            const sun = document.querySelector('.moving-sun');
            if (!sun) return;
            const container = sun.closest('.watch-row');
            if (!container) return;

            // ─── CONFIGURATION ────────────────────────────────────────────────
            // 1. To increase the sun's maximum height, make this value more negative:
            //    e.g., -0.05 (default), -0.15 (medium), -0.25 (high), -0.40 (very high)
            const arcHeight = -0.50; // <-- ADJUST THIS VALUE TO CONTROL ARC HEIGHT
            // ────────────────────────────────────────────────────────────────────

            const moveDuration = 13000;   // 5 seconds to move from sunrise to sunset
            const pauseDuration = 100;  // 5 seconds to pause at sunset
            const totalDuration = moveDuration + pauseDuration;
            let startTime = performance.now();

            function animateSun(time) {
                let elapsed = (time - startTime) % totalDuration;
                let t;

                if (elapsed < moveDuration) {
                    // Moving phase: calculate t from 0 to 1
                    t = elapsed / moveDuration;
                } else {
                    // Pause phase: hold at sunset position (t = 1)
                    t = 1;
                }

                // Bezier curve: P0 = (0.1, 0.8)  → sunrise (lower-left)
                //               P1 = (0.5, arcHeight) → control point (higher = more negative)
                //               P2 = (0.9, 0.8)  → sunset (lower-right)
                const px = (1 - t) * (1 - t) * 0.1 + 2 * (1 - t) * t * 0.5 + t * t * 0.9;
                const py = (1 - t) * (1 - t) * 0.8 + 2 * (1 - t) * t * arcHeight + t * t * 0.8;

                const rect = container.getBoundingClientRect();
                const cw = rect.width;
                const ch = rect.height;
                const x = px * cw;
                const y = py * ch;

                sun.style.left = x + 'px';
                sun.style.top = y + 'px';

                sunAnimationId = requestAnimationFrame(animateSun);
            }

            if (sunAnimationId) cancelAnimationFrame(sunAnimationId);
            sunAnimationId = requestAnimationFrame(animateSun);
        }

        function stopSunAnimation() {
            if (sunAnimationId) {
                cancelAnimationFrame(sunAnimationId);
                sunAnimationId = null;
            }
        }

                // ─── HOURLY ──────────────────────────────────────────────────
                const hourly = data.hourly;
                const hourlyTimes = hourly.time.map(t => {
                    return luxon.DateTime.fromISO(t, { zone: timezone }).toJSDate();
                });

                const nowLocalDT = luxon.DateTime.fromISO(localTimeStr, { zone: timezone });
                const currentHour = nowLocalDT.startOf('hour');
                let startIdx = hourlyTimes.findIndex(t => {
                    const dt = luxon.DateTime.fromJSDate(t, { zone: timezone });
                    return dt.hasSame(currentHour, 'hour');
                });
                if (startIdx === -1) {
                    for (let i = hourlyTimes.length - 1; i >= 0; i--) {
                        if (hourlyTimes[i] <= nowLocal) {
                            startIdx = i;
                            break;
                        }
                    }
                    if (startIdx === -1) startIdx = 0;
                }

                const extraStart = Math.max(0, startIdx - 2);
                const endIdx = Math.min(hourlyTimes.length, extraStart + 28);

                const sunriseDT = luxon.DateTime.fromISO(sunriseStr, { zone: timezone });
                const sunsetDT = luxon.DateTime.fromISO(sunsetStr, { zone: timezone });

                const displayItems = [];
                let sunriseInserted = false;
                let sunsetInserted = false;

                for (let i = extraStart; i < endIdx; i++) {
                    const h = hourlyTimes[i];
                    const hourStart = luxon.DateTime.fromJSDate(h, { zone: timezone }).startOf('hour');
                    const hourEnd = hourStart.plus({ hours: 1 });

                    displayItems.push({
                        type: 'hour',
                        date: h,
                        index: i,
                        temp: hourly.temperature_2m[i],
                        code: hourly.weather_code[i],
                    });

                    if (!sunriseInserted && sunriseDT >= hourStart && sunriseDT < hourEnd) {
                        displayItems.push({
                            type: 'sunrise',
                            date: sunriseDT.toJSDate(),
                            timeStr: formatTimeOnly(sunriseStr, timezone)
                        });
                        sunriseInserted = true;
                    }

                    if (!sunsetInserted && sunsetDT >= hourStart && sunsetDT < hourEnd) {
                        displayItems.push({
                            type: 'sunset',
                            date: sunsetDT.toJSDate(),
                            timeStr: formatTimeOnly(sunsetStr, timezone)
                        });
                        sunsetInserted = true;
                    }
                }

                displayItems.sort((a, b) => a.date.getTime() - b.date.getTime());

                let hourlyHtml = `<div class="section-title">Hourly Forecast</div><div class="hourly-scroll">`;
                for (const item of displayItems) {
                    if (item.type === 'sunrise') {
                        hourlyHtml += `<div class="hourly-marker sunrise-marker">
                                    <div class="marker-line"></div>
                                    <div class="marker-icon">🌅</div>
                                    <div class="marker-time">${item.timeStr}</div>
                                </div>`;
                    } else if (item.type === 'sunset') {
                        hourlyHtml += `<div class="hourly-marker sunset-marker">
                                    <div class="marker-line"></div>
                                    <div class="marker-icon">🌇</div>
                                    <div class="marker-time">${item.timeStr}</div>
                                </div>`;
                    } else {
                        const h = item.date;
                        const hourLabel = h.getHours() === 0 ? '12 AM' : (h.getHours() < 12 ? h.getHours() + ' AM' : (h
                            .getHours() - 12) + ' PM');
                        const isDayHour = h >= sunrise && h <= sunset;
                        const info = getWeatherInfo(item.code, isDayHour);
                        const tempC = item.temp;
                        hourlyHtml += `<div class="hourly-item">
                                    <div class="hour">${hourLabel}</div>
                                    <div class="icon">${info.icon}</div>
                                    <div class="temp">${tempStr(tempC)}</div>
                                </div>`;
                    }
                }
                hourlyHtml += `</div>`;
                hourlyContainer.innerHTML = hourlyHtml;

                // ─── DAILY ────────────────────────────────────────────────────
                let dailyHtml = `<div class="section-title">10‑Day Forecast</div><div class="daily-list">`;
                for (let i = 0; i < Math.min(days, 10); i++) {
                    const date = luxon.DateTime.fromISO(daily.time[i], { zone: timezone }).toJSDate();
                    const dayName = i === 0 ? 'Today' : date.toLocaleDateString('en', { weekday: 'short' });
                    const dateStr = date.toLocaleDateString('en', { month: 'short', day: 'numeric' });
                    const maxC = daily.temperature_2m_max[i];
                    const minC = daily.temperature_2m_min[i];
                    const info = getWeatherInfo(daily.weather_code[i], true);
                    const icon = info.icon;
                    const precipChance = daily.precipitation_sum[i] !== undefined ? daily.precipitation_sum[i].toFixed(
                        0) : '0';
                    dailyHtml += `
                                <div class="daily-row">
                                    <div class="day">${dayName} ${dateStr}</div>
                                    <div class="icon">${icon}</div>
                                    <div class="temps"><span class="max">${tempStr(maxC)}</span><span class="min">${tempStr(minC)}</span></div>
                                    <div class="precip">${precipChance} mm</div>
                                </div>
                            `;
                }
                dailyHtml += `</div>`;
                dailyContainer.innerHTML = dailyHtml;

                // Update canvas size after layout
                setTimeout(() => {
                    const c = document.getElementById('weather-canvas');
                    const cont = document.getElementById('merged-display');
                    if (c && cont) {
                        const r = cont.getBoundingClientRect();
                        c.width = r.width || 640;
                        c.height = r.height || 800;
                        c.style.width = '100%';
                        c.style.height = '100%';
                    }
                }, 80);

            } catch (err) {
                console.error('Weather dashboard error:', err);
                headerContainer.innerHTML =
                    `<div class="loading-text" style="color: #f87171;">⚠️ Failed to load weather. ${err.message}</div>`;
            }
        }

        // ─── Init ────────────────────────────────────────────────────────────
        function initWeather() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        const name = await fetchLocationName(latitude, longitude);
                        lastLocation = { lat: latitude, lon: longitude, name };
                        loadWeatherDashboard();
                    },
                    (err) => {
                        console.warn('Geolocation error:', err);
                        const fallbackLat = 40.7128,
                            fallbackLon = -74.0060;
                        fetchLocationName(fallbackLat, fallbackLon).then(name => {
                            lastLocation = { lat: fallbackLat, lon: fallbackLon, name };
                            loadWeatherDashboard();
                        });
                    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 600000 }
                );
            } else {
                const fallbackLat = 40.7128,
                    fallbackLon = -74.0060;
                fetchLocationName(fallbackLat, fallbackLon).then(name => {
                    lastLocation = { lat: fallbackLat, lon: fallbackLon, name };
                    loadWeatherDashboard();
                });
            }
        }

        document.addEventListener('DOMContentLoaded', function() {
            initWeather();

            window.addEventListener('resize', function() {
                const wc = document.getElementById('weather-canvas');
                const cw = document.getElementById('merged-display');
                if (wc && cw && weatherCache) {
                    const rect = cw.getBoundingClientRect();
                    wc.width = rect.width || 640;
                    wc.height = rect.height || 800;
                    wc.style.width = '100%';
                    wc.style.height = '100%';
                }
                if (document.querySelector('.moving-sun')) {
                    stopSunAnimation();
                    startSunAnimation();
                }
            });

            setInterval(() => {
                if (weatherCache) {
                    const timezone = weatherCache.timezone || 'UTC';
                    const now = new Date();
                    const localTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                    const sunrise = new Date(weatherCache.daily.sunrise[0]);
                    const sunset = new Date(weatherCache.daily.sunset[0]);
                    const timeOfDay = getTimeOfDay(sunrise, sunset, localTime);
                    const dashboard = document.getElementById('weather-dashboard-container');
                    if (dashboard.getAttribute('data-time') !== timeOfDay) {
                        dashboard.setAttribute('data-time', timeOfDay);
                        let code = weatherCache.current.weather_code;
                        let wind = weatherCache.current.wind_speed_10m || 0;
                        stopWeatherAnimation();
                        startWeatherAnimation(code, wind, timeOfDay);
                    }
                }
            }, 300000);
        });
    </script>

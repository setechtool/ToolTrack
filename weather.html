<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Weather · ToolTrack</title>
    <script src="https://cdn.jsdelivr.net/npm/luxon@3.5.0/build/global/luxon.min.js">
    </script>
    <style>
        /* ── Reset & base ── */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background: #0b1a2a;
            color: #fff;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
            margin: 0;
        }

        .weather-dashboard {
            border-radius: 24px;
            padding: 12px 16px 20px;
            width: 100%;
            max-width: 760px;
            margin: 0 auto;
            height: 98vh;
            max-height: 98vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            background: linear-gradient(135deg, #0b4a8a 0%, #2d7fc0 60%, #6bb3e8 100%);
            transition: background 1.2s ease;
            color: #fff;
            position: relative;
        }
        .weather-dashboard.layout-mode {
            height: auto;
            max-height: none;
            overflow-y: visible;
            display: block;
            padding-bottom: 20px;
        }

        /* ── Scrollbar for lower part ── */
        .scrollable-content::-webkit-scrollbar {
            width: 5px;
        }
        .scrollable-content::-webkit-scrollbar-track {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 10px;
            margin: 10px 0;
        }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.35);
            border-radius: 10px;
        }
        .scrollable-content::-webkit-scrollbar-button {
            display: none;
        }
        .scrollable-content {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.35) rgba(255, 255, 255, 0.08);
        }

        /* ── Sticky header (upper part) ── */
        .sticky-header {
            flex-shrink: 0;
            padding: 0 0 8px 0;
            border-bottom: 2px solid rgba(255, 255, 255, 0.15);
            margin-bottom: 8px;
            position: relative;
            z-index: 10;
            background: transparent;
            backdrop-filter: none;
            -webkit-backdrop-filter: none;
        }
		.sticky-header {
			border: none !important;
		}
        .sticky-header::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            right: 0;
            height: 2px;
            background: linear-gradient(90deg, transparent, rgba(255, 215, 0, 0.3), rgba(255, 100, 100, 0.3), transparent);
            border-radius: 2px;
        }

        .sticky-header .widget {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            width: 100% !important;
            min-height: auto !important;
            padding: 2px 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: auto;
        }
        .sticky-header .widget .drag-handle,
        .sticky-header .widget .resize-handle {
            display: none !important;
        }

        /* ── Merged display: canvas + temperature ── */
        #merged-display {
            position: relative;
            height: 5cm;
            /* 5 cm height */
            width: 100%;
            background: transparent;
            margin: 2px 0 4px 0;
            border-radius: 20px;
            overflow: hidden;
            /* contain canvas */
            pointer-events: none;
            /* allow clicks to pass through to search etc. */
        }
        #merged-display>* {
            pointer-events: none;
        }
        #merged-display #widget-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            padding: 0 !important;
            border: none !important;
            background: transparent !important;
            pointer-events: none;
            overflow: hidden;
            border-radius: 20px;
        }
        #merged-display #widget-canvas canvas {
            width: 100% !important;
            height: 100% !important;
            display: block;
            border-radius: 20px;
            pointer-events: none;
        }
        #merged-display #widget-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 !important;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: none;
        }
        #merged-display #widget-header .widget-content {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        #merged-display #widget-header .weather-header-row {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 2px;
            text-align: center;
            padding: 0 10px;
            width: 100%;
            pointer-events: none;
        }
        #merged-display #widget-header .weather-header-row .weather-icon-header {
            font-size: 2.8rem;
            line-height: 1;
            margin-bottom: 2px;
        }
        #merged-display #widget-header .weather-header-row .location-datetime {
            display: flex;
            flex-direction: column;
            gap: 0;
        }
        #merged-display #widget-header .weather-header-row .location-datetime .loc-name {
            font-size: 1rem;
            font-weight: 600;
            line-height: 1.2;
        }
        #merged-display #widget-header .weather-header-row .location-datetime .loc-date {
            font-size: 0.65rem;
            opacity: 0.7;
            line-height: 1.2;
        }
        #merged-display #widget-header .weather-header-row .temp-header {
            display: flex;
            align-items: baseline;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
            margin-top: 2px;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-value {
            font-size: 3.8rem;
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.02em;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-condition {
            font-size: 0.85rem;
            font-weight: 500;
            opacity: 0.9;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow {
            font-size: 0.7rem;
            opacity: 0.7;
            display: inline-flex;
            gap: 6px;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow .max {
            color: #fbbf24;
        }
        #merged-display #widget-header .weather-header-row .temp-header .temp-highlow .min {
            color: #93c5fd;
        }

        /* ── Layout mode overrides for merged display ── */
        .weather-dashboard.layout-mode .sticky-header,
        .weather-dashboard.layout-mode .scrollable-content {
            position: static !important;
            display: block !important;
            flex: none !important;
            overflow-y: visible !important;
            padding: 0 !important;
            margin: 0 !important;
            border: none !important;
            gap: 0 !important;
        }
        .weather-dashboard.layout-mode .sticky-header {
            border-bottom: none !important;
            background: transparent !important;
            backdrop-filter: none !important;
        }
        .weather-dashboard.layout-mode .sticky-header::after {
            display: none;
        }
        .weather-dashboard.layout-mode #merged-display {
            position: absolute !important;
            height: auto !important;
            min-height: 120px;
            background: rgba(10, 20, 40, 0.25) !important;
            backdrop-filter: blur(2px);
            border: 1px solid rgba(255, 255, 255, 0.08) !important;
            border-radius: 24px;
            pointer-events: all;
            cursor: grab;
            padding: 10px !important;
            margin: 0 !important;
            overflow: visible;
        }
        .weather-dashboard.layout-mode #merged-display.dragging {
            cursor: grabbing;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
            z-index: 20;
            border-color: rgba(74, 158, 255, 0.6) !important;
            background: rgba(10, 20, 40, 0.45) !important;
        }
        .weather-dashboard.layout-mode #merged-display .drag-handle {
            display: flex !important;
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 26px;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 16px 16px 0 0;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.3);
            font-size: 18px;
            letter-spacing: 4px;
            user-select: none;
            pointer-events: all;
            cursor: grab;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            z-index: 5;
        }
        .weather-dashboard.layout-mode #merged-display .drag-handle:hover {
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.6);
        }
        .weather-dashboard.layout-mode #merged-display .resize-handle {
            display: block !important;
            position: absolute;
            bottom: 4px;
            right: 4px;
            width: 18px;
            height: 18px;
            background: rgba(255, 255, 255, 0.08);
            border-radius: 4px;
            cursor: nwse-resize;
            pointer-events: all;
            border: 1px solid rgba(255, 255, 255, 0.06);
            z-index: 5;
        }
        .weather-dashboard.layout-mode #merged-display .resize-handle:hover {
            background: rgba(74, 158, 255, 0.35);
            border-color: rgba(74, 158, 255, 0.5);
        }
        .weather-dashboard.layout-mode #merged-display .resize-handle::after {
            content: "⤡";
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgba(255, 255, 255, 0.4);
            line-height: 1;
        }
        .weather-dashboard.layout-mode #merged-display #widget-canvas {
            position: relative !important;
            width: 100% !important;
            height: 100% !important;
            min-height: 60px;
            pointer-events: none;
        }
        .weather-dashboard.layout-mode #merged-display #widget-header {
            position: relative !important;
            pointer-events: none;
        }
        /* In layout mode, the merged display is draggable as a unit */
        .weather-dashboard.layout-mode .sticky-header .widget .drag-handle,
        .weather-dashboard.layout-mode .sticky-header .widget .resize-handle {
            display: none !important;
        }

        /* ── Scrollable content (lower part) ── */
        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            overflow-x: hidden;
            display: flex;
            flex-direction: column;
            gap: 18px;
            padding-right: 4px;
            padding-bottom: 10px;
        }

        .scrollable-content .widget {
            position: relative !important;
            left: auto !important;
            top: auto !important;
            width: 100% !important;
            min-height: auto !important;
            padding: 2px 0;
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            pointer-events: auto;
        }
        .scrollable-content .widget .drag-handle,
        .scrollable-content .widget .resize-handle {
            display: none !important;
        }

        /* ── Layout mode for scrollable widgets ── */
        .weather-dashboard.layout-mode .scrollable-content .widget {
            position: absolute !important;
            padding: 10px !important;
            background: rgba(10, 20, 40, 0.50) !important;
            backdrop-filter: blur(12px) !important;
            border: 1px solid rgba(255, 255, 255, 0.10) !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25) !important;
            min-width: 140px !important;
            min-height: 50px !important;
            pointer-events: all !important;
            cursor: grab !important;
            border-radius: 16px !important;
        }
        .weather-dashboard.layout-mode .scrollable-content .widget .drag-handle {
            display: flex !important;
        }
        .weather-dashboard.layout-mode .scrollable-content .widget .resize-handle {
            display: block !important;
        }

        /* ── Widget search (two rows) ── */
        #widget-search .widget-content {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .search-top-row {
            display: flex;
            align-items: center;
            justify-content: flex-end;
            gap: 4px;
        }
        .search-top-row button {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            width: 32px;
            height: 32px;
            border-radius: 50%;
            font-size: 0.95rem;
            cursor: pointer;
            backdrop-filter: blur(4px);
            transition: background 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid rgba(255, 255, 255, 0.08);
            flex-shrink: 0;
        }
        .search-top-row button:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .search-bottom-row {
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
            z-index: 100;
        }
        .search-bottom-row .search-input-wrap {
            flex: 1;
            min-width: 0;
            position: relative;
        }
        .search-bottom-row .search-input-wrap input {
            width: 100%;
            padding: 7px 14px;
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.20);
            background: rgba(255, 255, 255, 0.10);
            backdrop-filter: blur(4px);
            color: #fff;
            font-size: 0.85rem;
            outline: none;
        }
        .search-bottom-row .search-input-wrap input::placeholder {
            color: rgba(255, 255, 255, 0.5);
        }
        .search-bottom-row .search-input-wrap input:focus {
            border-color: rgba(255, 255, 255, 0.5);
        }
        .search-bottom-row .loc-btn {
            background: rgba(255, 255, 255, 0.12);
            border: none;
            color: #fff;
            padding: 5px 14px;
            border-radius: 24px;
            cursor: pointer;
            font-size: 0.8rem;
            white-space: nowrap;
            transition: background 0.2s;
            display: flex;
            align-items: center;
            gap: 5px;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.06);
            flex-shrink: 0;
        }
        .search-bottom-row .loc-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }
        .search-bottom-row .loc-btn span {
            display: inline;
        }

        /* ── Search suggestions (always on top) ── */
        .search-suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: rgba(10, 10, 30, 0.95);
            backdrop-filter: blur(12px);
            border-radius: 16px;
            margin-top: 4px;
            max-height: 200px;
            overflow-y: auto;
            z-index: 9999 !important;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.6);
        }
        .search-suggestions .suggestion-item {
            padding: 10px 16px;
            cursor: pointer;
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
            color: #fff;
            font-size: 0.85rem;
            transition: background 0.15s;
        }
        .search-suggestions .suggestion-item:hover {
            background: rgba(255, 255, 255, 0.10);
        }

        /* ── Details grid ── */
        .details-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 0;
        }
        .detail-card {
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(4px);
            border-radius: 14px;
            padding: 10px 8px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }
        .detail-card .label {
            font-size: 0.6rem;
            text-transform: uppercase;
            opacity: 0.6;
            letter-spacing: 0.4px;
        }
        .detail-card .value {
            font-size: 1rem;
            font-weight: 600;
            margin-top: 1px;
        }
        .detail-card .sub {
            font-size: 0.65rem;
            opacity: 0.6;
        }

        /* ── Sections ── */
        .section-title {
            font-size: 0.95rem;
            font-weight: 600;
            margin: 0 0 6px 0;
            opacity: 0.85;
            letter-spacing: 0.3px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.08);
            padding-bottom: 4px;
        }
        .hourly-scroll {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            padding: 4px 2px 8px;
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.25) transparent;
            -webkit-overflow-scrolling: touch;
            align-items: stretch;
        }
        .hourly-scroll::-webkit-scrollbar {
            height: 4px;
        }
        .hourly-scroll::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.25);
            border-radius: 10px;
        }
        .hourly-scroll::-webkit-scrollbar-button {
            display: none;
        }
        .hourly-item {
            flex: 0 0 62px;
            text-align: center;
            font-size: 0.75rem;
            position: relative;
            background: rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 4px 2px;
            border: 1px solid rgba(255, 255, 255, 0.03);
        }
        .hourly-item .hour {
            opacity: 0.6;
            font-size: 0.6rem;
        }
        .hourly-item .icon {
            font-size: 1.4rem;
            margin: 1px 0;
        }
        .hourly-item .icon i {
            font-size: 1.4rem;
        }
        .hourly-item .temp {
            font-weight: 600;
            font-size: 0.75rem;
        }
        .hourly-item .extra {
            font-size: 0.5rem;
            opacity: 0.7;
            display: block;
            margin-top: 1px;
        }

        /* ── Sunrise / Sunset markers in hourly ── */
        .hourly-marker {
            flex: 0 0 52px;
            text-align: center;
            font-size: 0.6rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: rgba(255, 215, 0, 0.08);
            border-radius: 12px;
            border: 1px solid rgba(255, 215, 0, 0.15);
            padding: 4px 2px;
            flex-shrink: 0;
            box-shadow: 0 0 12px rgba(255, 215, 0, 0.05);
        }
        .hourly-marker .marker-icon {
            font-size: 1.4rem;
            line-height: 1.2;
        }
        .hourly-marker .marker-time {
            font-size: 0.6rem;
            opacity: 0.9;
            font-weight: 600;
            color: #fff;
            text-shadow: 0 0 8px rgba(0, 0, 0, 0.6);
        }
        .hourly-marker.sunrise-marker {
            border-color: rgba(255, 215, 0, 0.4);
            background: rgba(255, 215, 0, 0.12);
        }
        .hourly-marker.sunrise-marker .marker-icon {
            color: #fbbf24;
        }
        .hourly-marker.sunset-marker {
            border-color: rgba(255, 100, 50, 0.4);
            background: rgba(255, 100, 50, 0.12);
        }
        .hourly-marker.sunset-marker .marker-icon {
            color: #f97316;
        }

        /* ── Daily ── */
        .daily-list {
            display: flex;
            flex-direction: column;
            gap: 3px;
            margin-top: 2px;
        }
        .daily-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 5px 8px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            transition: background 0.2s;
            border: 1px solid rgba(255, 255, 255, 0.03);
            gap: 4px;
        }
        .daily-row:hover {
            background: rgba(255, 255, 255, 0.10);
        }
        .daily-row .day {
            font-weight: 500;
            font-size: 0.8rem;
            width: 70px;
            flex-shrink: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .daily-row .icon {
            font-size: 1.4rem;
            width: 34px;
            text-align: center;
            flex-shrink: 0;
        }
        .daily-row .icon i {
            font-size: 1.4rem;
        }
        .daily-row .temps {
            font-weight: 500;
            font-size: 0.85rem;
            flex-shrink: 0;
            white-space: nowrap;
        }
        .daily-row .temps .max {
            color: #fbbf24;
        }
        .daily-row .temps .min {
            color: #93c5fd;
            margin-left: 6px;
        }
        .daily-row .precip {
            font-size: 0.65rem;
            opacity: 0.6;
            width: 48px;
            text-align: right;
            flex-shrink: 0;
            white-space: nowrap;
        }

        /* ── Sunrise/Sunset ── */
        .sunrise-sunset {
            display: flex;
            justify-content: space-around;
            background: rgba(255, 255, 255, 0.06);
            border-radius: 14px;
            padding: 12px 10px;
            margin: 0;
            border: 1px solid rgba(255, 255, 255, 0.04);
        }
        .sunrise-sunset .item {
            text-align: center;
        }
        .sunrise-sunset .item .label {
            font-size: 0.65rem;
            opacity: 0.6;
        }
        .sunrise-sunset .item .time {
            font-weight: 600;
            font-size: 0.85rem;
        }

        .loading-text {
            text-align: center;
            padding: 30px 0;
            opacity: 0.7;
            font-size: 0.9rem;
        }

        /* ── Stars ── */
        .star {
            position: absolute;
            border-radius: 50%;
            background: #fff;
            pointer-events: none;
            z-index: 0;
            animation: twinkle var(--duration, 2s) ease-in-out infinite alternate;
        }
        @keyframes twinkle {
            0% {
                opacity: 0.2;
                transform: scale(0.8);
            }
            100% {
                opacity: 1;
                transform: scale(1.2);
            }
        }

        /* ── Settings Overlay ── */
        .settings-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            z-index: 1000;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .settings-overlay.open {
            display: flex;
        }
        .settings-panel {
            background: #1a2a3a;
            border-radius: 28px;
            padding: 28px 32px;
            max-width: 600px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            color: #e8eef5;
            box-shadow: 0 24px 80px rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.08);
        }
        .settings-panel h2 {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .settings-panel h2 .close-settings {
            margin-left: auto;
            background: rgba(255, 255, 255, 0.1);
            border: none;
            color: #fff;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 1.1rem;
            cursor: pointer;
            transition: background 0.2s;
        }

        .settings-panel .panel-row {

        }
        .settings-panel .panel-row .btn.danger {

            color: #fff;
        }
        .settings-panel .panel-row .btn.danger:hover {

        }
        .settings-panel .panel-row .btn.layout-toggle {

        .setting-group {
            margin-bottom: 16px;

        .setting-group label {

        }

            border-radius: 4px;

            width: 18px;
            height: 18px;
            border-radius: 50%;

            cursor: pointer;
            border: 2px solid #fff;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);

        .setting-group select {
            width: 100%;
            padding: 8px 12px;
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.08);

            color: #e8eef5;
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;

        .setting-group select option {

            display: flex;
            gap: 10px;
            margin-top: 6px;

        .setting-group .action-group button {
            flex: 1;
            padding: 8px 12px;
            border: none;
            border-radius: 12px;
            background: #4a9eff;
            color: #fff;
            font-weight: 500;
            cursor: pointer;

        }
        .setting-group .action-group button:hover {
            background: #3a8aee;

            background: rgba(255, 255, 255, 0.04);

        .param-group .group-title {

            text-transform: uppercase;
            letter-spacing: 0.5px;
            opacity: 0.5;
            margin-bottom: 10px;
            font-weight: 600;

        .preset-list {
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0, 0, 0, 0.2);
            border-radius: 10px;
            padding: 4px;
        }
        .preset-list .preset-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 6px 12px;
            border-radius: 8px;
            cursor: pointer;

        .preset-list .preset-item:hover {

        .preset-list .preset-item .preset-name {

            border: none;

            cursor: pointer;
            font-size: 0.8rem;
            padding: 2px 8px;
            border-radius: 6px;
            transition: background 0.15s;
        }
        .preset-list .preset-item .preset-del:hover {
            background: rgba(224, 96, 96, 0.2);
        }
        .preset-list .preset-item.active {
            background: rgba(74, 158, 255, 0.15);
            border-left: 3px solid #4a9eff;
        }
        .preset-save-row {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }
        .preset-save-row input {
            flex: 1;
            padding: 6px 12px;
            border-radius: 10px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #e8eef5;
            font-size: 0.85rem;
            outline: none;
        }
        .preset-save-row input::placeholder {
            color: rgba(255, 255, 255, 0.3);
        }
        .preset-save-row input:focus {
            border-color: rgba(74, 158, 255, 0.4);
        }
        .preset-save-row button {
            padding: 6px 16px;
            border: none;
            border-radius: 10px;
            background: #4a9eff;
            color: #fff;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            font-size: 0.85rem;
            white-space: nowrap;
        }
        .preset-save-row button:hover {

        }

        .preview-section {
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid rgba(255, 255, 255, 0.08);
        }
        .preview-section .preview-label {
            font-size: 0.8rem;
            opacity: 0.6;
            margin-bottom: 8px;
            display: block;
        }
        .preview-canvas-wrap {
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            background: linear-gradient(145deg, #0b4a8a 0%, #2d7fc0 50%, #6bb3e8 100%);

            aspect-ratio: 16/9;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .preview-canvas-wrap canvas {
            width: 100%;
            height: 100%;
            display: block;
        }
        .preview-status {
            display: flex;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 0.7rem;
            opacity: 0.5;
            color: #8aaac8;
        }
        .settings-apply-btn {
            width: 100%;
            padding: 10px;
            margin-top: 16px;
            border: none;
            border-radius: 16px;
            background: #4a9eff;
            color: #fff;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        .settings-apply-btn:hover {

        }

        .settings-panel::-webkit-scrollbar {
            width: 4px;
        }
        .settings-panel::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 4px;
        }
        .settings-panel::-webkit-scrollbar-button {
            display: none;
        }
        .settings-panel {
            scrollbar-width: thin;
            scrollbar-color: rgba(255, 255, 255, 0.2) transparent;
        }

        /* ── Preset modal ── */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.5);
            z-index: 2000;
            display: none;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.open {
            display: flex;
        }
        .modal-box {
            background: #1a2a3a;
            border-radius: 20px;
            padding: 24px 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.06);
        }
        .modal-box h3 {
            margin-bottom: 12px;
            font-weight: 500;
        }
        .modal-box input {
            width: 100%;
            padding: 10px 14px;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.06);
            color: #e8eef5;
            font-size: 0.95rem;
            outline: none;
            margin-bottom: 12px;
        }
        .modal-box input:focus {
            border-color: rgba(74, 158, 255, 0.4);
        }
        .modal-box .modal-actions {
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }
        .modal-box .modal-actions button {
            padding: 8px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 500;
            transition: background 0.2s;
        }
        .modal-box .modal-actions .btn-cancel {
            background: rgba(255, 255, 255, 0.08);
            color: #c8d8e8;
        }
        .modal-box .modal-actions .btn-cancel:hover {
            background: rgba(255, 255, 255, 0.15);
        }
        .modal-box .modal-actions .btn-confirm {
            background: #4a9eff;
            color: #fff;
        }
        .modal-box .modal-actions .btn-confirm:hover {
            background: #3a8aee;
        }

        /* ── Snap indicator ── */
        .snap-indicator {
            position: absolute;
            pointer-events: none;
            z-index: 16;
            background: rgba(74, 220, 255, 0.7);
            border-radius: 50%;
            width: 8px;
            height: 8px;
            box-shadow: 0 0 12px rgba(74, 220, 255, 0.4);
            display: none;
            transform: translate(-50%, -50%);
        }
        .snap-indicator.visible {
            display: block;
        }
        .snap-indicator.horizontal {
            width: 12px;
            height: 3px;
            border-radius: 2px;
            transform: translate(-50%, -50%);
        }
        .snap-indicator.vertical {
            width: 3px;
            height: 12px;
            border-radius: 2px;
            transform: translate(-50%, -50%);
        }

        /* ── Spacing guide ── */
        .spacing-guide {
            position: absolute;
            pointer-events: none;
            z-index: 16;
            border: 1px solid rgba(74, 220, 255, 0.25);
            border-top: none;
            border-bottom: none;
            display: none;
        }
        .spacing-guide.visible {
            display: block;
        }
        .spacing-guide .bracket-label {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: rgba(74, 220, 255, 0.5);
            font-size: 9px;
            background: rgba(0, 0, 0, 0.3);
            padding: 1px 6px;
            border-radius: 8px;
            white-space: nowrap;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        /* ── Dynamic text contrast ── */
        .weather-dashboard * {
            text-shadow: 0 1px 3px rgba(0, 0, 0, 0.75), 0 2px 8px rgba(0, 0, 0, 0.35);
        }
        .weather-dashboard[data-time="day"][data-weather="clouds"] .widget-content *,
        .weather-dashboard[data-time="dawn"][data-weather="clouds"] .widget-content *,
        .weather-dashboard[data-time="dusk"][data-weather="clouds"] .widget-content *,
        .weather-dashboard[data-time="day"][data-weather="fog"] .widget-content *,
        .weather-dashboard[data-time="dawn"][data-weather="fog"] .widget-content *,
        .weather-dashboard[data-time="dusk"][data-weather="fog"] .widget-content *,

            text-shadow: 0 1px 4px rgba(0, 0, 0, 0.85), 0 2px 10px rgba(0, 0, 0, 0.45), 0 0 2px rgba(0, 0, 0, 0.3);
        }

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <script>
        // ═══════════════════════════════════════════════════════════════════
        //  WEATHER APP + LAYOUT MANAGER with Magnetic Snap, Push & Guides
        // ═══════════════════════════════════════════════════════════════════

        // ─── State ──────────────────────────────────────────────────────────
        let weatherCache = null;
        let lastLocation = null;
        let searchTimeout = null;
        let animFrame = null;
        let weatherParticles = [];
        let stars = [];
        let currentAnimationCleanup = null;
        let previewStopFn = null;
        let previewTimeout = null;
        let presets = {};
        let currentTimeOfDay = 'day';
        let currentWeatherCat = 'clear';
        let layoutMode = false;

        // ─── Toggle states ──────────────────────────────────────────────
        let snapEnabled = true;
        let pushEnabled = true;
        let guidesEnabled = true;

        // ─── DEFAULT SETTINGS ─────────────────────────────────────────────
        const DEFAULT_SETTINGS = {
            tempUnit: 'c',
            cloudDensity: 0.5,
            cloudSize: 0.5,
            cloudSpeed: 0.5,
            cloudOpacity: 0.5,
            rainSize: 0.5,
            rainFreq: 0.5,
            rainSpeed: 0.5,
            thunderIntensity: 0.5,
            lightningFreq: 0.5,
            thunderRainSize: 0.5,
            thunderRainFreq: 0.5,
            snowSize: 0.5,
            snowDensity: 0.5,
            snowSpeed: 0.5,
            snowWobble: 0.5,
            fogDensity: 0.5,
            fogSize: 0.5,
        };

        const settings = { ...DEFAULT_SETTINGS };

        // ─── Weather icons ──────────────────────────────────────────────────
        const weatherIcons = {
            0: { day: '☀️', night: '<i class="fa-solid fa-moon" style="color: #FFFFFF;"></i>', desc: 'Clear Sky' },
            1: { day: '🌤', night: '🌤', desc: 'Mainly Clear' },
            2: { day: '⛅', night: '☁️', desc: 'Partly Cloudy' },
            3: { day: '☁️', night: '☁️', desc: 'Overcast' },
            45: { day: '🌫', night: '🌫', desc: 'Fog' },
            48: { day: '🌫', night: '🌫', desc: 'Rime Fog' },
            51: { day: '🌦', night: '🌦', desc: 'Light Drizzle' },
            53: { day: '🌦', night: '🌦', desc: 'Moderate Drizzle' },
            55: { day: '🌦', night: '🌦', desc: 'Dense Drizzle' },
            56: { day: '🌧', night: '🌧', desc: 'Light Freezing Drizzle' },
            57: { day: '🌧', night: '🌧', desc: 'Dense Freezing Drizzle' },
            61: { day: '🌧', night: '🌧', desc: 'Slight Rain' },
            63: { day: '🌧', night: '🌧', desc: 'Moderate Rain' },
            65: { day: '🌧', night: '🌧', desc: 'Heavy Rain' },
            66: { day: '🌧', night: '🌧', desc: 'Light Freezing Rain' },
            67: { day: '🌧', night: '🌧', desc: 'Heavy Freezing Rain' },
            71: { day: '❄️', night: '❄️', desc: 'Slight Snow' },
            73: { day: '❄️', night: '❄️', desc: 'Moderate Snow' },
            75: { day: '❄️', night: '❄️', desc: 'Heavy Snow' },
            77: { day: '🌨', night: '🌨', desc: 'Snow Grains' },
            80: { day: '🌦', night: '🌦', desc: 'Slight Rain Showers' },
            81: { day: '🌦', night: '🌦', desc: 'Moderate Rain Showers' },
            82: { day: '🌦', night: '🌦', desc: 'Violent Rain Showers' },
            85: { day: '❄️', night: '❄️', desc: 'Slight Snow Showers' },
            86: { day: '❄️', night: '❄️', desc: 'Heavy Snow Showers' },
            95: { day: '⛈', night: '⛈', desc: 'Thunderstorm' },
            96: { day: '⛈', night: '⛈', desc: 'Thunderstorm with Hail' },
            99: { day: '⛈', night: '⛈', desc: 'Severe Thunderstorm' }
        };

        function getWeatherInfo(code, isDay) {
            const w = weatherIcons[code] || { day: '🌡️', night: '🌡️', desc: 'Unknown' };
            return { icon: isDay ? w.day : w.night, desc: w.desc };
        }

        function getWindDirection(deg) {
            const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
            return dirs[Math.round(deg / 45) % 8];
        }

        function getWeatherCategory(code) {
            if (code === 0 || code === 1) return 'clear';
            if (code === 2 || code === 3) return 'clouds';
            if ((code >= 45 && code <= 48)) return 'fog';
            if ((code >= 51 && code <= 57) || (code >= 61 && code <= 67) || (code >= 80 && code <= 82)) return 'rain';
            if ((code >= 71 && code <= 77) || (code >= 85 && code <= 86)) return 'snow';
            if (code >= 95 && code <= 99) return 'thunderstorm';
            return 'clear';
        }

        function getRainIntensity(code) {
            if (code >= 51 && code <= 57) return 'drizzle';
            if (code === 61 || code === 80) return 'light';
            if (code === 63 || code === 81) return 'moderate';
            if (code === 65 || code === 82) return 'heavy';
            if (code >= 95 && code <= 99) return 'storm';
            return 'moderate';
        }

        function getTimeOfDay(sunrise, sunset, now) {
            const dawnStart = new Date(sunrise.getTime() - 30 * 60000);
            const dawnEnd = new Date(sunrise.getTime() + 30 * 60000);
            const duskStart = new Date(sunset.getTime() - 30 * 60000);
            const duskEnd = new Date(sunset.getTime() + 30 * 60000);
            if (now >= dawnStart && now <= dawnEnd) return 'dawn';
            if (now >= duskStart && now <= duskEnd) return 'dusk';
            if (now > sunrise && now < sunset) return 'day';
            return 'night';
        }

        // ─── API ─────────────────────────────────────────────────────────────
        function fetchWeatherData(lat, lon) {
            const url =
                `https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lon}&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,pressure_msl&daily=weather_code,temperature_2m_max,temperature_2m_min,sunrise,sunset,uv_index_max,precipitation_sum,windspeed_10m_max&hourly=temperature_2m,weather_code,precipitation_probability&timezone=auto&temperature_unit=celsius&windspeed_unit=kmh&precipitation_unit=mm&forecast_days=10`;
            return fetch(url).then(r => { if (!r.ok) throw new Error('Weather API error'); return r.json(); });
        }

        async function fetchLocationName(lat, lon) {
            try {
                const url =
                    `https://nominatim.openstreetmap.org/reverse?format=json&lat=${lat}&lon=${lon}&zoom=10&accept-language=en`;
                const res = await fetch(url, { headers: { 'User-Agent': 'ToolTrack/2.1.8' } });
                if (!res.ok) throw new Error('Nominatim API error');
                const data = await res.json();
                let displayName = `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
                if (data && data.address) {
                    const addr = data.address;
                    let parts = [];
                    if (addr.suburb) parts.push(addr.suburb);
                    else if (addr.city) parts.push(addr.city);
                    else if (addr.town) parts.push(addr.town);
                    else if (addr.village) parts.push(addr.village);
                    else if (addr.county) parts.push(addr.county);
                    else if (addr.state) parts.push(addr.state);
                    if (addr.country) parts.push(addr.country);
                    if (parts.length > 0) displayName = parts.join(', ');
                    else displayName = data.display_name || displayName;
                }
                displayName = displayName.replace(/\(\d+\.\d+,\s*\d+\.\d+\)/, '').trim();
                return displayName;
            } catch (e) {
                console.warn('Reverse geocoding error:', e);
                return `${lat.toFixed(2)}, ${lon.toFixed(2)}`;
            }
        }

        async function searchLocations(query) {
            if (!query || query.length < 2) return [];
            const url =
                `https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(query)}&count=10&language=en&format=json`;
            try {
                const res = await fetch(url);
                const data = await res.json();
                if (data.results) {
                    return data.results.map(r => ({
                        name: r.name,
                        country: r.country || '',
                        admin1: r.admin1 || '',
                        latitude: r.latitude,
                        longitude: r.longitude,
                        display: [r.name, r.admin1, r.country].filter(Boolean).join(', ')
                    }));
                }
                return [];
            } catch (e) {
                console.warn('Search error:', e);
                return [];
            }
        }

        // ─── Stars ──────────────────────────────────────────────────────────
        function createStars(count) {
            document.querySelectorAll('.star').forEach(el => el.remove());
            stars = [];
            const container = document.getElementById('weather-dashboard-container');
            for (let i = 0; i < count; i++) {
                const star = document.createElement('div');
                star.className = 'star';
                const size = 1 + Math.random() * 3;
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 80 + '%';
                star.style.setProperty('--duration', (1.5 + Math.random() * 3) + 's');
                star.style.animationDelay = (Math.random() * 3) + 's';
                star.style.opacity = 0.3 + Math.random() * 0.7;
                container.appendChild(star);
                stars.push(star);
            }
        }

        function clearStars() {
            document.querySelectorAll('.star').forEach(el => el.remove());
            stars = [];
        }

        // ─── Cloud palette ───────────────────────────────────────────────────
        function getCloudPalette() {
            if (currentWeatherCat === 'thunderstorm') {
                return { lit: '196,199,204', mid: '160,165,176', edge: '112,118,132', outer: '78,84,102', shadow: '18,19,26' };
            }
            switch (currentTimeOfDay) {
                case 'dawn':
                    return { lit: '255,238,220', mid: '250,218,196', edge: '236,193,172', outer: '218,175,158', shadow: '112,82,68' };
                case 'dusk':
                    return { lit: '250,228,236', mid: '233,199,218', edge: '203,164,194', outer: '172,133,168', shadow: '70,46,80' };
                case 'night':
                    return { lit: '205,214,232', mid: '168,181,206', edge: '126,141,172', outer: '96,112,148', shadow: '18,22,42' };
                default:
                    return { lit: '248,252,255', mid: '230,242,253', edge: '215,232,248', outer: '200,220,245', shadow: '75,95,130' };
            }
        }

        function drawPhotorealisticCloud(ctx, x, y, size, opacity, density) {
            const s = size * 0.85;
            const d = 0.3 + density * 0.5;
            const pal = getCloudPalette();
            ctx.save();

            const puffs = [
                { dx: 0, dy: 0, r: s * 0.95, depth: 1.0 },
                { dx: -s * 0.55, dy: s * 0.06, r: s * 0.60, depth: 0.88 },
                { dx: s * 0.50, dy: s * 0.02, r: s * 0.58, depth: 0.92 },
                { dx: -s * 0.35, dy: -s * 0.28, r: s * 0.50, depth: 0.78 },
                { dx: s * 0.38, dy: -s * 0.22, r: s * 0.48, depth: 0.82 },
                { dx: -s * 0.68, dy: s * 0.18, r: s * 0.42, depth: 0.72 },
                { dx: s * 0.65, dy: s * 0.14, r: s * 0.44, depth: 0.74 },
                { dx: 0, dy: -s * 0.38, r: s * 0.46, depth: 0.90 },
                { dx: -s * 0.20, dy: s * 0.26, r: s * 0.38, depth: 0.68 },
                { dx: s * 0.22, dy: s * 0.20, r: s * 0.36, depth: 0.70 },
                { dx: -s * 0.45, dy: -s * 0.12, r: s * 0.32, depth: 0.65 },
                { dx: s * 0.48, dy: -s * 0.08, r: s * 0.30, depth: 0.67 },
                { dx: -s * 0.15, dy: s * 0.40, r: s * 0.28, depth: 0.60 },
                { dx: s * 0.12, dy: s * 0.36, r: s * 0.26, depth: 0.62 },
            ];

            const baseOpacity = opacity * 0.80;

            for (const puff of puffs) {
                const px = x + puff.dx;
                const py = y + puff.dy;
                const pr = puff.r * (0.70 + 0.30 * d);

                const grad = ctx.createRadialGradient(
                    px - pr * 0.20, py - pr * 0.30, pr * 0.08,
                    px, py, pr * 1.35
                );
                const alpha = baseOpacity * puff.depth * (0.70 + 0.30 * (puff.r / s));
                grad.addColorStop(0, `rgba(${pal.lit}, ${alpha * 0.98})`);
                grad.addColorStop(0.20, `rgba(${pal.lit}, ${alpha * 0.90})`);
                grad.addColorStop(0.50, `rgba(${pal.mid}, ${alpha * 0.68})`);
                grad.addColorStop(0.78, `rgba(${pal.edge}, ${alpha * 0.38})`);
                grad.addColorStop(1, `rgba(${pal.outer}, 0)`);

                ctx.beginPath();
                ctx.ellipse(px, py, pr * 0.98, pr * 0.58, 0, 0, Math.PI * 2);
                ctx.fillStyle = grad;
                ctx.fill();

                const hlGrad = ctx.createRadialGradient(
                    px - pr * 0.20, py - pr * 0.32, 0,
                    px - pr * 0.16, py - pr * 0.26, pr * 0.50
                );
                hlGrad.addColorStop(0, `rgba(255, 255, 255, ${alpha * 0.50})`);
                hlGrad.addColorStop(0.40, `rgba(255, 255, 255, ${alpha * 0.20})`);
                hlGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
                ctx.beginPath();
                ctx.ellipse(px - pr * 0.12, py - pr * 0.24, pr * 0.42, pr * 0.22, -0.20, 0, Math.PI * 2);
                ctx.fillStyle = hlGrad;
                ctx.fill();
            }

            const shadowGrad = ctx.createRadialGradient(
                x - s * 0.08, y + s * 0.20, s * 0.15,
                x, y + s * 0.30, s * 0.95
            );
            shadowGrad.addColorStop(0, `rgba(${pal.shadow}, ${opacity * 0.18})`);
            shadowGrad.addColorStop(0.60, `rgba(${pal.shadow}, ${opacity * 0.06})`);
            shadowGrad.addColorStop(1, `rgba(${pal.shadow}, 0)`);
            ctx.beginPath();
            ctx.ellipse(x, y + s * 0.28, s * 0.80, s * 0.22, 0, 0, Math.PI * 2);
            ctx.fillStyle = shadowGrad;
            ctx.fill();

            ctx.restore();
        }

        function drawRaindrop(ctx, x, y, size, opacity, tilt, elongation, highlight, speed) {
            const len = size * 5.2 * elongation;
            const wid = size * 0.95;
            const angle = tilt + Math.PI / 2 + 0.12;
            ctx.save();
            ctx.translate(x, y);
            ctx.rotate(angle);

            const alpha = Math.min(opacity, 0.92);

            let r0 = '195, 228, 255',
                r1 = '175, 215, 248',
                r2 = '135, 185, 235',
                r3 = '95, 145, 215';
            if (currentTimeOfDay === 'night') { r0 = '150, 175, 205';
                r1 = '125, 152, 190';
                r2 = '90, 115, 155';
                r3 = '60, 82, 120'; } else if (currentTimeOfDay === 'dawn' || currentTimeOfDay === 'dusk') { r0 =
                    '210, 220, 240';
                r1 = '190, 200, 228';
                r2 = '150, 165, 205';
                r3 = '110, 125, 175'; }

            const grad = ctx.createLinearGradient(0, -len * 0.6, 0, len * 0.4);
            grad.addColorStop(0, `rgba(${r0}, ${alpha * 0.95})`);
            grad.addColorStop(0.35, `rgba(${r1}, ${alpha * 0.85})`);
            grad.addColorStop(0.7, `rgba(${r2}, ${alpha * 0.55})`);
            grad.addColorStop(1, `rgba(${r3}, ${alpha * 0.05})`);

            ctx.beginPath();
            ctx.ellipse(0, 0, wid, len, 0, 0, Math.PI * 2);
            ctx.fillStyle = grad;
            ctx.fill();

            const hlGrad = ctx.createLinearGradient(-wid * 0.6, -len * 0.65, wid * 0.4, -len * 0.2);
            hlGrad.addColorStop(0, `rgba(255, 255, 255, ${0.75 * highlight})`);
            hlGrad.addColorStop(0.4, `rgba(255, 255, 255, ${0.35 * highlight})`);
            hlGrad.addColorStop(1, `rgba(255, 255, 255, 0)`);
            ctx.beginPath();
            ctx.ellipse(-wid * 0.25, -len * 0.42, wid * 0.55, len * 0.38, 0, 0, Math.PI * 2);
            ctx.fillStyle = hlGrad;
            ctx.fill();

            ctx.strokeStyle = `rgba(225, 245, 255, ${alpha * 0.45})`;
            ctx.lineWidth = wid * 0.6;
            ctx.beginPath();
            ctx.moveTo(0, -len * 0.85);
            ctx.lineTo(0, len * 0.1);
            ctx.stroke();

            ctx.restore();

            if (speed > 3.5) {
                ctx.save();
                ctx.globalAlpha = alpha * 0.18;
                ctx.translate(x - Math.sin(angle) * speed * 0.65, y + Math.cos(angle) * speed * 0.55);
                ctx.rotate(angle);
                ctx.fillStyle = `rgba(185, 225, 255, 0.25)`;
                ctx.beginPath();
                ctx.ellipse(0, len * 0.6, wid * 0.45, len * 0.85, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        function drawSnowflake(ctx, x, y, size, opacity) {
            const r = size * 0.92;
            ctx.save();

            let s0 = '245, 252, 255',
                s1 = '255, 255, 255',
                s2 = '250, 252, 255',
                s3 = '235, 245, 255',
                s4 = '220, 235, 250';
            if (currentTimeOfDay === 'night') { s0 = '210, 222, 245';
                s1 = '225, 235, 255';
                s2 = '205, 218, 245';
                s3 = '178, 195, 230';
                s4 = '150, 170, 210'; } else if (currentTimeOfDay === 'dawn' || currentTimeOfDay === 'dusk') { s0 =
                    '250, 240, 245';
                s1 = '255, 250, 250';
                s2 = '250, 238, 240';
                s3 = '240, 220, 228';
                s4 = '225, 200, 212'; }

            const glow = ctx.createRadialGradient(x, y, 0, x, y, r * 3.5);
            glow.addColorStop(0, `rgba(${s0}, ${opacity * 0.28})`);
            glow.addColorStop(1, `rgba(${s3}, 0)`);
            ctx.fillStyle = glow;
            ctx.beginPath();
            ctx.arc(x, y, r * 3.5, 0, Math.PI * 2);
            ctx.fill();

            const grad = ctx.createRadialGradient(x - r * 0.25, y - r * 0.28, r * 0.15, x, y, r * 1.05);
            grad.addColorStop(0, `rgba(${s1}, ${opacity * 0.98})`);
            grad.addColorStop(0.45, `rgba(${s2}, ${opacity * 0.82})`);
            grad.addColorStop(0.75, `rgba(${s3}, ${opacity * 0.55})`);
            grad.addColorStop(1, `rgba(${s4}, ${opacity * 0.25})`);
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, r, 0, Math.PI * 2);
            ctx.fill();

            ctx.strokeStyle = `rgba(${s0}, ${opacity * 0.75})`;
            ctx.lineWidth = Math.max(0.7, r * 0.085);
            ctx.lineCap = "round";

            for (let i = 0; i < 6; i++) {
                const a = i * (Math.PI / 3) + Date.now() * 0.00028;
                const armLen = r * 0.92;
                ctx.beginPath();
                ctx.moveTo(x, y);
                ctx.lineTo(x + Math.cos(a) * armLen, y + Math.sin(a) * armLen);
                ctx.stroke();

                const b1 = a + 0.45;
                const b2 = a - 0.45;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * armLen * 0.55, y + Math.sin(a) * armLen * 0.55);
                ctx.lineTo(x + Math.cos(a) * armLen * 0.55 + Math.cos(b1) * armLen * 0.38, y + Math.sin(a) * armLen * 0.55 +
                    Math.sin(b1) * armLen * 0.38);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(a) * armLen * 0.55, y + Math.sin(a) * armLen * 0.55);
                ctx.lineTo(x + Math.cos(a) * armLen * 0.55 + Math.cos(b2) * armLen * 0.38, y + Math.sin(a) * armLen * 0.55 +
                    Math.sin(b2) * armLen * 0.38);
                ctx.stroke();
            }

            ctx.restore();
        }

        function drawFog(ctx, x, y, size, opacity) {
            const w = size * 1.65;
            const h = size * 0.72;
            ctx.save();

            let c0 = '235, 245, 255',
                c1 = '225, 238, 252',
                c2 = '210, 225, 245',
                c3 = '190, 210, 235';
            if (currentTimeOfDay === 'dawn') { c0 = '250, 235, 220';
                c1 = '244, 222, 205';
                c2 = '228, 205, 195';
                c3 = '205, 185, 180'; } else if (currentTimeOfDay === 'dusk') { c0 = '235, 220, 230';
                c1 = '218, 202, 220';
                c2 = '196, 182, 205';
                c3 = '170, 158, 190'; } else if (currentTimeOfDay === 'night') { c0 = '190, 200, 215';
                c1 = '160, 172, 195';
                c2 = '125, 138, 165';
                c3 = '95, 108, 140'; }

            const grad = ctx.createRadialGradient(x, y - size * 0.15, size * 0.3, x, y, size * 1.4);
            grad.addColorStop(0, `rgba(${c0}, ${opacity * 1.35})`);
            grad.addColorStop(0.4, `rgba(${c1}, ${opacity * 0.95})`);
            grad.addColorStop(0.75, `rgba(${c2}, ${opacity * 0.55})`);
            grad.addColorStop(1, `rgba(${c3}, 0)`);

            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.ellipse(x, y, w, h, 0.1, 0, Math.PI * 2);
            ctx.fill();

            ctx.globalAlpha = opacity * 0.45;
            ctx.beginPath();
            ctx.ellipse(x + size * 0.2, y - size * 0.1, w * 0.75, h * 0.65, -0.15, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
        }

        // ─── Particle engine ──────────────────────────────────────────────────
        function buildParticles(weatherCode, windSpeed, timeOfDay, settingsOverride) {
            const s = settingsOverride || settings;
            const cat = getWeatherCategory(weatherCode);
            const intensity = getRainIntensity(weatherCode);
            const windFactor = Math.min(windSpeed / 15, 2.5);

            let particleCount = 0;
            let type = 'none';
            let speedBase = 0,
                speedRange = 0,
                sizeBase = 0,
                sizeRange = 0,
                opacityBase = 0,
                opacityRange = 0;
            let isDrizzle = false;

            if (cat === 'rain') {
                type = 'rain';
                const freqMul = 0.5 + s.rainFreq * 1.0;
                const sizeMul = 0.5 + s.rainSize * 1.0;
                const speedMul = 0.5 + s.rainSpeed * 0.8;
                switch (intensity) {
                    case 'drizzle':
                        particleCount = Math.round(120 * freqMul);
                        speedBase = 0.85 * speedMul;
                        speedRange = 0.75;
                        sizeBase = 0.30 * sizeMul;
                        sizeRange = 0.30 * sizeMul;
                        opacityBase = 0.28;
                        opacityRange = 0.22;
                        isDrizzle = true;
                        break;
                    case 'light':
                        particleCount = Math.round(180 * freqMul);
                        speedBase = 2.8 * speedMul;
                        speedRange = 1.6;
                        sizeBase = 0.55 * sizeMul;
                        sizeRange = 0.55 * sizeMul;
                        opacityBase = 0.38;
                        opacityRange = 0.32;
                        break;
                    case 'moderate':
                        particleCount = Math.round(280 * freqMul);
                        speedBase = 4.8 * speedMul;
                        speedRange = 2.1;
                        sizeBase = 0.75 * sizeMul;
                        sizeRange = 0.75 * sizeMul;
                        opacityBase = 0.43;
                        opacityRange = 0.36;
                        break;
                    case 'heavy':
                        particleCount = Math.round(420 * freqMul);
                        speedBase = 7.4 * speedMul;
                        speedRange = 3.2;
                        sizeBase = 0.95 * sizeMul;
                        sizeRange = 0.95 * sizeMul;
                        opacityBase = 0.48;
                        opacityRange = 0.42;
                        break;
                    case 'storm':
                        particleCount = Math.round(520 * freqMul);
                        speedBase = 9.4 * speedMul;
                        speedRange = 4.6;
                        sizeBase = 1.10 * sizeMul;
                        sizeRange = 1.10 * sizeMul;
                        opacityBase = 0.52;
                        opacityRange = 0.41;
                        break;
                    default:
                        particleCount = Math.round(220 * freqMul);
                        speedBase = 3.7 * speedMul;
                        speedRange = 2.1;
                        sizeBase = 0.70 * sizeMul;
                        sizeRange = 0.70 * sizeMul;
                        opacityBase = 0.38;
                        opacityRange = 0.36;
                }
                speedBase += windFactor * 0.18;
            } else if (cat === 'snow') {
                type = 'snow';
                const sizeMul = 0.5 + s.snowSize * 1.0;
                const densityMul = 0.5 + s.snowDensity * 1.0;
                const speedMul = 0.5 + s.snowSpeed * 0.8;
                const wobbleMul = 0.2 + s.snowWobble * 1.2;
                const isHeavy = weatherCode >= 75 || weatherCode >= 86;
                particleCount = Math.round((isHeavy ? 380 : 210) * densityMul);
                speedBase = (isHeavy ? 1.65 : 0.75) * speedMul;
                speedRange = (isHeavy ? 1.45 : 1.05) * speedMul;
                sizeBase = (isHeavy ? 3.6 : 2.1) * sizeMul;
                sizeRange = (isHeavy ? 3.6 : 2.6) * sizeMul;
                opacityBase = 0.55 + 0.2 * densityMul;
                opacityRange = 0.38;
            } else if (cat === 'fog') {
                type = 'fog';
                const densityMul = 0.5 + s.fogDensity * 1.0;
                const sizeMul = 0.5 + s.fogSize * 1.0;
                particleCount = Math.round(85 * densityMul);
                speedBase = 0.09;
                speedRange = 0.13;
                sizeBase = 32 * sizeMul;
                sizeRange = 55 * sizeMul;
                opacityBase = 0.065 * densityMul;
                opacityRange = 0.11 * densityMul;
            } else if (cat === 'clouds') {
                type = 'cloud';
                const density = 0.3 + s.cloudDensity * 0.7;
                const size = 0.3 + s.cloudSize * 0.5;
                const speed = 0.2 + s.cloudSpeed * 0.4;
                const opacity = 0.5 + s.cloudOpacity * 0.5;
                particleCount = Math.round(25 * density + 10);
                speedBase = 0.008;
                speedRange = 0.012;
                sizeBase = 150 * size;
                sizeRange = 10 * size;
                opacityBase = opacity;
                opacityRange = opacity * 0.25;
            } else if (cat === 'thunderstorm') {
                type = 'thunder';
                const freqMul = 0.5 + s.thunderRainFreq * 1.0;
                const sizeMul = 0.5 + s.thunderRainSize * 1.0;
                const thunderMul = 0.5 + s.thunderIntensity * 1.0;
                const lightningMul = 0.5 + s.lightningFreq * 1.0;
                particleCount = Math.round(460 * freqMul);
                speedBase = 8.4 + thunderMul * 2.1;
                speedRange = 4.3 + thunderMul * 1.6;
                sizeBase = 1.10 * sizeMul;
                sizeRange = 1.10 * sizeMul;
                opacityBase = 0.51;
                opacityRange = 0.41;
            } else if (cat === 'clear' && timeOfDay === 'night') {
                type = 'clear-night';
                particleCount = 32;
                speedBase = 0.022;
                speedRange = 0.038;
                sizeBase = 1.05;
                sizeRange = 1.55;
                opacityBase = 0.32;
                opacityRange = 0.48;
            } else {
                type = 'none';
                particleCount = 0;
            }

            const particles = [];
            for (let i = 0; i < particleCount; i++) {
                const p = {
                    x: Math.random() * 640,
                    y: Math.random() * 360,
                    speed: speedBase + (Math.random() - 0.5) * speedRange * 2,
                    size: sizeBase + Math.random() * sizeRange,
                    opacity: opacityBase + Math.random() * opacityRange,
                    wind: (0.2 + Math.random() * 0.6) * windFactor + 0.2,
                    type: type,
                    wobble: 0,
                    wobbleSpeed: 0.005 + Math.random() * 0.015,
                    phase: Math.random() * Math.PI * 2,
                    tilt: -0.1 + Math.random() * 0.2,
                    elongation: 0.01 + Math.random() * 0.4,
                    highlight: 0.3 + Math.random() * 0.5,
                    density: 0.5 + Math.random() * 0.5,
                };
                if (isDrizzle) {
                    p.speed = 0.42 + Math.random() * 0.58;
                    p.size = 0.32 + Math.random() * 0.48;
                    p.opacity = 0.22 + Math.random() * 0.18;
                    p.elongation = 0.42 + Math.random() * 0.28;
                }
                if (type === 'snow') {
                    const wobbleMul = 0.2 + settings.snowWobble * 1.2;
                    p.wobble = (0.2 + Math.random() * 1.2) * wobbleMul;
                    p.wobbleSpeed = 0.003 + Math.random() * 0.015;
                    p.phase = Math.random() * Math.PI * 2;
                    p.size = sizeBase + Math.random() * sizeRange * 0.82;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = (0.1 + Math.random() * 0.5) * windFactor + 0.1;
                }
                if (type === 'fog') {
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.speed = speedBase + Math.random() * speedRange;
                    p.wind = (0.03 + Math.random() * 0.1) * windFactor + 0.03;
                }
                if (type === 'cloud') {
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.speed = speedBase + Math.random() * speedRange;
                    p.wind = 0.2 + (s.cloudSpeed * 0.15) + Math.random() * 0.15;
                    p.y = Math.random() * 360 * 0.7 + 20;
                    p.density = 0.3 + Math.random() * 0.5;
                }
                if (type === 'thunder') {
                    p.speed = speedBase + (Math.random() - 0.5) * speedRange * 2;
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = (0.2 + Math.random() * 0.5) * windFactor + 0.2;
                }
                if (type === 'clear-night') {
                    p.speed = speedBase + (Math.random() - 0.5) * speedRange * 2;
                    p.size = sizeBase + Math.random() * sizeRange;
                    p.opacity = opacityBase + Math.random() * opacityRange;
                    p.wind = 0.02 + Math.random() * 0.03;
                }
                particles.push(p);
            }
            return { particles, type, cat, intensity };
        }

        // ─── Lightning with branching ──────────────────────────────────────
        function generateLightningBolt(W, H, branches = 3) {
            const points = [];
            let x = W * (0.2 + Math.random() * 0.6);
            let y = 0;
            const endY = H * (0.5 + Math.random() * 0.4);
            points.push([x, y]);
            const segments = 8 + Math.floor(Math.random() * 5);
            for (let i = 1; i <= segments; i++) {
                y = (endY / segments) * i;
                x += (Math.random() - 0.5) * W * 0.12;
                points.push([x, y]);
            }
            // Add branches
            const branchesList = [];
            for (let b = 0; b < branches; b++) {
                if (Math.random() < 0.4) continue;
                const startIdx = 2 + Math.floor(Math.random() * (points.length - 3));
                const [sx, sy] = points[startIdx];
                const branchPoints = [
                    [sx, sy],
                    [sx + (Math.random() - 0.5) * W * 0.08, sy + (Math.random() * H * 0.08)],
                    [sx + (Math.random() - 0.5) * W * 0.12, sy + (Math.random() * H * 0.15)]
                ];
                branchesList.push(branchPoints);
            }
            return { main: points, branches: branchesList };
        }

        function runAnimation(canvas, particles, type, weatherCode, settingsOverride, isPreview) {
            const ctx = canvas.getContext('2d');
            const W = canvas.width,
                H = canvas.height;
            let animating = true;
            let flashTimer = 0,
                flashIntensity = 0;
            let boltData = null,
                boltLife = 0;

            const thunderMul = 0.5 + (settingsOverride?.thunderIntensity || settings.thunderIntensity);
            const lightningMul = 0.5 + (settingsOverride?.lightningFreq || settings.lightningFreq);

            function animate() {
                if (!animating) return;
                ctx.clearRect(0, 0, W, H);

                if (isPreview) {
                    const grad = ctx.createLinearGradient(0, 0, 0, H);
                    grad.addColorStop(0, '#0b4a8a');
                    grad.addColorStop(0.5, '#2d7fc0');
                    grad.addColorStop(1, '#6bb3e8');
                    ctx.fillStyle = grad;
                    ctx.fillRect(0, 0, W, H);
                }

                if (type === 'thunder') {
                    flashTimer += 0.016;
                    // Lower frequency: threshold increased
                    const lightningThreshold = Math.max(0.8, 2.2 / lightningMul);
                    if (flashTimer > lightningThreshold + Math.random() * 2.0) {
                        flashIntensity = (0.15 + Math.random() * 0.3) * Math.min(thunderMul, 1.4);
                        flashTimer = 0;
                        if (Math.random() < 0.5) {
                            const branches = 2 + Math.floor(Math.random() * 4);
                            boltData = generateLightningBolt(W, H, branches);
                            boltLife = 1.0;
                        }
                    }
                    if (boltData && boltLife > 0) {
                        ctx.save();
                        ctx.globalAlpha = boltLife;
                        ctx.shadowColor = 'rgba(200,225,255,0.9)';
                        ctx.shadowBlur = 20;
                        ctx.strokeStyle = 'rgba(235,245,255,0.95)';
                        ctx.lineWidth = 2.5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        // Main bolt
                        ctx.beginPath();
                        boltData.main.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                        ctx.stroke();
                        // Branches
                        for (const branch of boltData.branches) {
                            ctx.beginPath();
                            branch.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                            ctx.stroke();
                        }
                        ctx.shadowBlur = 10;
                        ctx.lineWidth = 5;
                        ctx.strokeStyle = 'rgba(210,230,255,0.3)';
                        ctx.beginPath();
                        boltData.main.forEach((pt, i) => i === 0 ? ctx.moveTo(pt[0], pt[1]) : ctx.lineTo(pt[0], pt[1]));
                        ctx.stroke();
                        ctx.restore();
                        boltLife *= 0.65;
                        if (boltLife < 0.03) { boltLife = 0;
                            boltData = null; }
                    }
                    if (flashIntensity > 0) {
                        ctx.fillStyle = `rgba(225,235,255,${flashIntensity})`;
                        ctx.fillRect(0, 0, W, H);
                        flashIntensity *= 0.90;
                        if (flashIntensity < 0.002) flashIntensity = 0;
                    }
                }

                for (const p of particles) {
                    p.x += p.wind;
                    p.y += p.speed;
                    if (p.type === 'snow' || p.type === 'clear-night') {
                        p.x += Math.sin(p.phase + Date.now() * 0.001 * p.wobbleSpeed) * p.wobble * 0.32;
                    }
                    const margin = 55;
                    if (p.x > W + margin) p.x = -margin;
                    if (p.x < -margin) p.x = W + margin;
                    if (p.y > H + margin) { p.y = -margin;
                        p.x = Math.random() * W; }
                    if (p.y < -margin) { p.y = H + margin;
                        p.x = Math.random() * W; }

                    if (p.type === 'rain' || p.type === 'thunder') {
                        drawRaindrop(ctx, p.x, p.y, p.size, p.opacity, p.tilt, p.elongation, p.highlight, p.speed);
                    } else if (p.type === 'snow') {
                        drawSnowflake(ctx, p.x, p.y, p.size, p.opacity);
                    } else if (p.type === 'fog') {
                        drawFog(ctx, p.x, p.y, p.size, p.opacity);
                    } else if (p.type === 'cloud') {
                        drawPhotorealisticCloud(ctx, p.x, p.y, p.size, p.opacity, p.density || 0.5);
                    } else if (p.type === 'clear-night') {
                        ctx.save();
                        ctx.shadowColor = 'rgba(255,255,255,0.35)';
                        ctx.shadowBlur = 8;
                        ctx.fillStyle = `rgba(255,255,255,${p.opacity * 0.45})`;
                        ctx.beginPath();
                        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.shadowBlur = 0;
                        ctx.restore();
                    }
                }

                if (isPreview) {
                    const label = document.getElementById('preview-weather-label');
                    const count = document.getElementById('preview-particle-count');
                    if (label) {
                        const info = getWeatherInfo(weatherCode, true);
                        label.textContent = info.desc;
                    }
                    if (count) count.textContent = particles.length + ' particles';
                }

                requestAnimationFrame(animate);
            }
            animate();

            return function stop() {
                animating = false;
            };
        }

        function startWeatherAnimation(weatherCode, windSpeed, timeOfDay, settingsOverride) {
            const canvas = document.getElementById('weather-canvas');
            if (!canvas) return;
            const container = document.getElementById('merged-display');
            const rect = container.getBoundingClientRect();

            const W = canvas.width = rect.width || 640;
            const H = canvas.height = rect.height || 800;
            canvas.style.width = '100%';
            canvas.style.height = '100%';

            currentTimeOfDay = timeOfDay || 'day';
            currentWeatherCat = getWeatherCategory(weatherCode);

            const result = buildParticles(weatherCode, windSpeed, timeOfDay, settingsOverride);
            weatherParticles = result.particles;
            const type = result.type;

            if (currentAnimationCleanup) {
                currentAnimationCleanup();
                currentAnimationCleanup = null;
            }

            const stopFn = runAnimation(canvas, weatherParticles, type, weatherCode, settingsOverride, false);
            currentAnimationCleanup = stopFn;

            if (timeOfDay === 'night') createStars(80);
            else clearStars();

            return stopFn;
        }

        // ═══════════════════════════════════════════════════════════════════

        const LAYOUT_KEY = 'weatherWidgetLayout_v9';
        const SNAP_THRESHOLD = 16;

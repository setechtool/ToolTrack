        // ─── Get widget rects ──────────────────────────────────────────────
        function getWidgetRects(container) {
            const rects = {};
            const widgets = document.querySelectorAll('.widget');
            const merged = document.getElementById('merged-display');
            const containerRect = container.getBoundingClientRect();
            if (merged) {
                const r = merged.getBoundingClientRect();
                rects['merged-display'] = {
                    left: r.left - containerRect.left,
                    top: r.top - containerRect.top,
                    right: r.right - containerRect.left,
                    bottom: r.bottom - containerRect.top,
                    width: r.width,
                    height: r.height,
                    centerX: (r.left + r.right) / 2 - containerRect.left,
                    centerY: (r.top + r.bottom) / 2 - containerRect.top,
                    el: merged,
                    id: 'merged-display'
                };
            }
            widgets.forEach(w => {
                const r = w.getBoundingClientRect();
                rects[w.id] = {
                    left: r.left - containerRect.left,
                    top: r.top - containerRect.top,
                    right: r.right - containerRect.left,
                    bottom: r.bottom - containerRect.top,
                    width: r.width,
                    height: r.height,
                    centerX: (r.left + r.right) / 2 - containerRect.left,
                    centerY: (r.top + r.bottom) / 2 - containerRect.top,
                    el: w,
                    id: w.id
                };
            });
            return rects;
        }

        // ─── Snap detection ──────────────────────────────────────────────────
        function applySnap(widget, proposedLeft, proposedTop, container) {
            if (!snapEnabled) return { left: proposedLeft, top: proposedTop, snapped: false };

            const allRects = getWidgetRects(container);
            const widgetId = widget.id;
            const others = Object.keys(allRects).filter(id => id !== widgetId);

            let bestSnap = { dx: 0, dy: 0, dist: Infinity, edge: null };

            const w = widget.offsetWidth;
            const h = widget.offsetHeight;

            for (const id of others) {
                const r = allRects[id];
                let d = Math.abs(proposedLeft - r.right);
                if (d < SNAP_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: r.right - proposedLeft, dy: 0, dist: d, edge: 'left-right' };
                }
                d = Math.abs(proposedLeft + w - r.left);
                if (d < SNAP_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: r.left - (proposedLeft + w), dy: 0, dist: d, edge: 'right-left' };
                }
                d = Math.abs(proposedTop - r.bottom);
                if (d < SNAP_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: 0, dy: r.bottom - proposedTop, dist: d, edge: 'top-bottom' };
                }
                d = Math.abs(proposedTop + h - r.top);
                if (d < SNAP_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: 0, dy: r.top - (proposedTop + h), dist: d, edge: 'bottom-top' };
                }
                d = Math.abs((proposedLeft + w / 2) - r.centerX);
                if (d < ALIGN_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: r.centerX - (proposedLeft + w / 2), dy: 0, dist: d, edge: 'center-h' };
                }
                d = Math.abs((proposedTop + h / 2) - r.centerY);
                if (d < ALIGN_THRESHOLD && d < bestSnap.dist) {
                    bestSnap = { dx: 0, dy: r.centerY - (proposedTop + h / 2), dist: d, edge: 'center-v' };
                }
            }

            if (bestSnap.dist < SNAP_THRESHOLD || bestSnap.dist < ALIGN_THRESHOLD) {
                return {
                    left: proposedLeft + bestSnap.dx,
                    top: proposedTop + bestSnap.dy,
                    snapped: true,
                    edge: bestSnap.edge,
                    dx: bestSnap.dx,
                    dy: bestSnap.dy
                };
            }
            return { left: proposedLeft, top: proposedTop, snapped: false };
        }

        // ─── Push detection ──────────────────────────────────────────────────
        function applyPush(widget, proposedLeft, proposedTop, container, dragDx, dragDy) {
            if (!pushEnabled) return;

            const allRects = getWidgetRects(container);
            const widgetId = widget.id;
            const w = widget.offsetWidth;
            const h = widget.offsetHeight;

            const isDraggingHorizontal = Math.abs(dragDx) > Math.abs(dragDy);
            const isDraggingDown = dragDy > 0;
            const isDraggingRight = dragDx > 0;

            for (const id of Object.keys(allRects)) {
                if (id === widgetId) continue;
                const r = allRects[id];
                const el = document.getElementById(id);
                if (!el) continue;

                const aLeft = proposedLeft,
                    aRight = proposedLeft + w;
                const aTop = proposedTop,
                    aBottom = proposedTop + h;
                const bLeft = r.left,
                    bRight = r.right;
                const bTop = r.top,
                    bBottom = r.bottom;

                const overlapX = Math.min(aRight, bRight) - Math.max(aLeft, bLeft);
                const overlapY = Math.min(aBottom, bBottom) - Math.max(aTop, bTop);

                if (overlapX > 0 && overlapY > 0) {
                    const pushX = overlapX;
                    const pushY = overlapY;

                    let newLeft = r.left;
                    let newTop = r.top;
                    let pushed = false;

                    if (isDraggingHorizontal || pushX < pushY) {
                        if (isDraggingRight) {
                            if (r.centerX > proposedLeft + w / 2) {
                                newLeft = r.left + pushX + 2;
                            } else {
                                newLeft = r.left - pushX - 2;
                            }
                        } else {
                            if (r.centerX < proposedLeft + w / 2) {
                                newLeft = r.left - pushX - 2;
                            } else {
                                newLeft = r.left + pushX + 2;
                            }
                        }
                        pushed = true;
                    } else {
                        if (isDraggingDown) {
                            if (r.centerY > proposedTop + h / 2) {
                                newTop = r.top + pushY + 2;
                            } else {
                                newTop = r.top - pushY - 2;
                            }
                        } else {
                            if (r.centerY < proposedTop + h / 2) {
                                newTop = r.top - pushY - 2;
                            } else {
                                newTop = r.top + pushY + 2;
                            }
                        }
                        pushed = true;
                    }

                    if (pushed) {
                        const containerRect = container.getBoundingClientRect();
                        const elW = el.offsetWidth;
                        const elH = el.offsetHeight;
                        newLeft = Math.max(0, Math.min(newLeft, containerRect.width - elW));
                        newTop = Math.max(0, Math.min(newTop, containerRect.height - elH));

                        const currentLeft = parseFloat(el.style.left) || 0;
                        const currentTop = parseFloat(el.style.top) || 0;
                        if (Math.abs(newLeft - currentLeft) > 0.5 || Math.abs(newTop - currentTop) > 0.5) {
                            el.style.left = newLeft + 'px';
                            el.style.top = newTop + 'px';
                            el.classList.add('push-highlight');
                            setTimeout(() => el.classList.remove('push-highlight'), 400);
                        }
                    }
                }
            }
        }

        // ─── Alignment guides ────────────────────────────────────────────────
        function drawGuides(draggedWidget, container) {
            if (!guidesEnabled || !layoutMode) {
                const canvas = document.getElementById('guide-canvas');
                if (canvas) {
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                }
                return;
            }

            const canvas = document.getElementById('guide-canvas');
            const ctx = canvas.getContext('2d');
            const rect = container.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            canvas.style.width = rect.width + 'px';
            canvas.style.height = rect.height + 'px';

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const allRects = getWidgetRects(container);
            const widgetId = draggedWidget ? draggedWidget.id : null;
            const others = Object.keys(allRects).filter(id => id !== widgetId);

            for (const id of others) {
                const r = allRects[id];
                if (draggedWidget) {
                    const dw = draggedWidget.offsetWidth;
                    const dh = draggedWidget.offsetHeight;
                    const dLeft = parseFloat(draggedWidget.style.left) || 0;
                    const dTop = parseFloat(draggedWidget.style.top) || 0;
                    const dCenterX = dLeft + dw / 2;
                    const dCenterY = dTop + dh / 2;

                    if (Math.abs(dCenterX - r.centerX) < ALIGN_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.25)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 6]);
                        ctx.beginPath();
                        ctx.moveTo(r.centerX, 0);
                        ctx.lineTo(r.centerX, canvas.height);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (Math.abs(dCenterY - r.centerY) < ALIGN_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.25)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([4, 6]);
                        ctx.beginPath();
                        ctx.moveTo(0, r.centerY);
                        ctx.lineTo(canvas.width, r.centerY);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (Math.abs(dLeft - r.left) < SNAP_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 5]);
                        ctx.beginPath();
                        ctx.moveTo(r.left, 0);
                        ctx.lineTo(r.left, canvas.height);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (Math.abs(dLeft + dw - r.right) < SNAP_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 5]);
                        ctx.beginPath();
                        ctx.moveTo(r.right, 0);
                        ctx.lineTo(r.right, canvas.height);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (Math.abs(dTop - r.top) < SNAP_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 5]);
                        ctx.beginPath();
                        ctx.moveTo(0, r.top);
                        ctx.lineTo(canvas.width, r.top);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                    if (Math.abs(dTop + dh - r.bottom) < SNAP_THRESHOLD) {
                        ctx.strokeStyle = 'rgba(74, 220, 255, 0.15)';
                        ctx.lineWidth = 1;
                        ctx.setLineDash([3, 5]);
                        ctx.beginPath();
                        ctx.moveTo(0, r.bottom);
                        ctx.lineTo(canvas.width, r.bottom);
                        ctx.stroke();
                        ctx.setLineDash([]);
                    }
                }
            }

            if (draggedWidget) {
                const dLeft = parseFloat(draggedWidget.style.left) || 0;
                const dTop = parseFloat(draggedWidget.style.top) || 0;
                const dw = draggedWidget.offsetWidth;
                const dh = draggedWidget.offsetHeight;
                ctx.strokeStyle = 'rgba(74, 220, 255, 0.6)';
                ctx.lineWidth = 1.5;
                ctx.setLineDash([2, 4]);
                const cx = dLeft + dw / 2;
                const cy = dTop + dh / 2;
                const crossSize = 12;
                ctx.beginPath();
                ctx.moveTo(cx - crossSize, cy);
                ctx.lineTo(cx + crossSize, cy);
                ctx.moveTo(cx, cy - crossSize);
                ctx.lineTo(cx, cy + crossSize);
                ctx.stroke();
                ctx.setLineDash([]);
                ctx.fillStyle = 'rgba(74, 220, 255, 0.7)';
                ctx.beginPath();
                ctx.arc(cx, cy, 2.5, 0, Math.PI * 2);
                ctx.fill();
            }
        }

        // ─── Drag & Drop for merged display (as a unit) ────────────────────
        function initMergedDrag() {
            const merged = document.getElementById('merged-display');
            if (!merged) return;
            const handle = merged.querySelector('.drag-handle');
            const resize = merged.querySelector('.resize-handle');
            if (handle) {
                handle.addEventListener('mousedown', (e) => startDrag(e, merged));
                handle.addEventListener('touchstart', (e) => startDrag(e, merged), { passive: false });
            }
            if (resize) {
                resize.addEventListener('mousedown', (e) => startResize(e, merged));
                resize.addEventListener('touchstart', (e) => startResize(e, merged), { passive: false });
                resize.addEventListener('dblclick', (e) => {
                    e.stopPropagation();
                    merged.style.width = '90%';
                    merged.style.height = 'auto';
                    saveLayout();
                });
            }
        }

        // ─── Drag & Drop for scrollable widgets ────────────────────────────
        function initLayoutEvents() {
            const widgets = document.querySelectorAll('.scrollable-content .widget');
            widgets.forEach(w => {
                const handle = w.querySelector('.drag-handle');
                if (handle) {
                    handle.addEventListener('mousedown', (e) => startDrag(e, w));
                    handle.addEventListener('touchstart', (e) => startDrag(e, w), { passive: false });
                }
                const resizeHandle = w.querySelector('.resize-handle');
                if (resizeHandle) {
                    resizeHandle.addEventListener('mousedown', (e) => startResize(e, w));
                    resizeHandle.addEventListener('touchstart', (e) => startResize(e, w), { passive: false });
                    resizeHandle.addEventListener('dblclick', (e) => {
                        e.stopPropagation();
                        w.style.width = '90%';
                        w.style.height = 'auto';
                        saveLayout();
                    });
                }
            });
            // Also init merged display drag
            initMergedDrag();
        }

        function startDrag(e, widget) {
            if (!layoutMode) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const rect = widget.getBoundingClientRect();
            dragOffsetX = touch.clientX - rect.left;
            dragOffsetY = touch.clientY - rect.top;
            draggedWidget = widget;
            widget.classList.add('dragging');
            widget.style.transition = 'none';
            lastDragX = touch.clientX;
            lastDragY = touch.clientY;
            dragDirection = { dx: 0, dy: 0 };

            document.addEventListener('mousemove', onDrag);
            document.addEventListener('touchmove', onDrag, { passive: false });
            document.addEventListener('mouseup', endDrag);
            document.addEventListener('touchend', endDrag);
        }

        function onDrag(e) {
            if (!draggedWidget) return;
            e.preventDefault();
            const touch = e.touches ? e.touches[0] : e;
            const container = draggedWidget.parentElement;
            const containerRect = container.getBoundingClientRect();

            const dx = touch.clientX - lastDragX;
            const dy = touch.clientY - lastDragY;
            dragDirection = { dx, dy };
            lastDragX = touch.clientX;
            lastDragY = touch.clientY;

            let x = touch.clientX - containerRect.left - dragOffsetX;
            let y = touch.clientY - containerRect.top - dragOffsetY;

            x = Math.max(0, Math.min(x, containerRect.width - draggedWidget.offsetWidth));
            y = Math.max(0, Math.min(y, containerRect.height - draggedWidget.offsetHeight));

            const snapResult = applySnap(draggedWidget, x, y, container);
            if (snapResult.snapped) {
                x = snapResult.left;
                y = snapResult.top;
                draggedWidget.classList.add('snap-highlight');
                setTimeout(() => draggedWidget.classList.remove('snap-highlight'), 200);
            }

            draggedWidget.style.left = x + 'px';
            draggedWidget.style.top = y + 'px';

            applyPush(draggedWidget, x, y, container, dx, dy);

            drawGuides(draggedWidget, container);
        }

        function endDrag() {
            if (draggedWidget) {
                draggedWidget.classList.remove('dragging');
                draggedWidget.style.transition = '';
                saveLayout();
                const container = draggedWidget.parentElement;
                drawGuides(null, container);
                draggedWidget = null;
            }
            document.removeEventListener('mousemove', onDrag);
            document.removeEventListener('touchmove', onDrag);
            document.removeEventListener('mouseup', endDrag);
            document.removeEventListener('touchend', endDrag);
        }

        function startResize(e, widget) {
            if (!layoutMode) return;
            e.preventDefault();
            e.stopPropagation();
            isResizing = true;
            const touch = e.touches ? e.touches[0] : e;
            const rect = widget.getBoundingClientRect();
            const startX = touch.clientX;
            const startY = touch.clientY;
            const startWidth = rect.width;
            const startHeight = rect.height;

            function onMove(ev) {
                if (!isResizing) return;
                ev.preventDefault();
                const t = ev.touches ? ev.touches[0] : ev;
                let dx = t.clientX - startX;
                let dy = t.clientY - startY;
                let newWidth = Math.max(140, startWidth + dx);
                let newHeight = Math.max(50, startHeight + dy);
                widget.style.width = newWidth + 'px';
                widget.style.height = newHeight + 'px';
                if (widget.id === 'merged-display') {
                    // Resize the canvas inside
                    const canvas = document.getElementById('weather-canvas');
                    if (canvas) {
                        const rect = widget.getBoundingClientRect();
                        canvas.width = rect.width || 640;
                        canvas.height = rect.height || 800;
                        canvas.style.width = '100%';
                        canvas.style.height = '100%';
                        if (weatherCache) {
                            const code = weatherCache.current.weather_code;
                            const wind = weatherCache.current.wind_speed_10m || 0;
                            const timezone = weatherCache.timezone || 'UTC';
                            const now = new Date();
                            const localTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                            const sunrise = new Date(weatherCache.daily.sunrise[0]);
                            const sunset = new Date(weatherCache.daily.sunset[0]);
                            const timeOfDay = getTimeOfDay(sunrise, sunset, localTime);
                            stopWeatherAnimation();
                            startWeatherAnimation(code, wind, timeOfDay, settings);
                        }
                    }
                }
            }

            function onEnd() {
                isResizing = false;
                document.removeEventListener('mousemove', onMove);
                document.removeEventListener('touchmove', onMove);
                document.removeEventListener('mouseup', onEnd);
                document.removeEventListener('touchend', onEnd);
                saveLayout();
                const container = widget.parentElement;
                drawGuides(null, container);
            }

            document.addEventListener('mousemove', onMove);
            document.addEventListener('touchmove', onMove, { passive: false });
            document.addEventListener('mouseup', onEnd);
            document.addEventListener('touchend', onEnd);
        }

        // ─── Load Dashboard ──────────────────────────────────────────────────
        async function loadWeatherDashboard() {
            const headerContainer = document.getElementById('forecast-header');
            const detailsContainer = document.getElementById('forecast-details');
            const sunriseContainer = document.getElementById('forecast-sunrise');
            const hourlyContainer = document.getElementById('forecast-hourly');
            const dailyContainer = document.getElementById('forecast-daily');

            if (!lastLocation) {
                headerContainer.innerHTML = '<div class="loading-text">Location not available.</div>';
                return;
            }
            try {
                const data = await fetchWeatherData(lastLocation.lat, lastLocation.lon);
                weatherCache = data;
                const timezone = data.timezone || 'UTC';
                if (!lastLocation.timezone) lastLocation.timezone = timezone;

                let weatherCode = data.current.weather_code;
                let windSpeed = data.current.wind_speed_10m || 0;

                const localTimeStr = data.current.time;
                const sunriseStr = data.daily.sunrise[0];
                const sunsetStr = data.daily.sunset[0];

                const nowLocal = luxon.DateTime.fromISO(localTimeStr, { zone: timezone }).toJSDate();
                const sunrise = luxon.DateTime.fromISO(sunriseStr, { zone: timezone }).toJSDate();
                const sunset = luxon.DateTime.fromISO(sunsetStr, { zone: timezone }).toJSDate();

                const timeOfDay = getTimeOfDay(sunrise, sunset, nowLocal);
                const isDayIcon = nowLocal >= sunrise && nowLocal <= sunset;

                const weatherInfo = getWeatherInfo(weatherCode, isDayIcon);

                const dashboard = document.getElementById('weather-dashboard-container');
                dashboard.setAttribute('data-time', timeOfDay);
                const cat = getWeatherCategory(weatherCode);
                dashboard.setAttribute('data-weather', cat);

                // Update canvas widget size
                const canvas = document.getElementById('weather-canvas');
                const container = document.getElementById('merged-display');
                if (canvas && container) {
                    const rect = container.getBoundingClientRect();
                    canvas.width = rect.width || 640;
                    canvas.height = rect.height || 800;
                    canvas.style.width = '100%';
                    canvas.style.height = '100%';
                }

                stopWeatherAnimation();
                startWeatherAnimation(weatherCode, windSpeed, timeOfDay, settings);

                updatePreview(weatherCode, windSpeed);

                const daily = data.daily;
                const days = daily.time.length;

                function convertTemp(c) {
                    if (settings.tempUnit === 'f') return (c * 9 / 5 + 32);
                    if (settings.tempUnit === 'k') return c + 273.15;
                    return c;
                }

                function tempStr(c) {
                    const val = convertTemp(c);
                    const unit = settings.tempUnit === 'f' ? '°F' : settings.tempUnit === 'k' ? 'K' : '°C';
                    return val.toFixed(0) + unit;
                }

                // ─── HEADER (centered) ──────────────────────────────────────
                const dateShort = formatDateShort(localTimeStr, timezone);
                const timeShort = formatTimeShort(localTimeStr, timezone);
                const currentTempC = data.current.temperature_2m;
                const highC = daily.temperature_2m_max[0];
                const lowC = daily.temperature_2m_min[0];

                headerContainer.innerHTML = `
                            <div class="weather-header-row">
                                <div class="weather-icon-header">${weatherInfo.icon}</div>
                                <div class="location-datetime">
                                    <span class="loc-name">${lastLocation.name}</span>
                                    <span class="loc-date">${dateShort} · ${timeShort}</span>
                                </div>
                                <div class="temp-header">
                                    <span class="temp-value">${tempStr(currentTempC)}</span>
                                    <span class="temp-condition">${weatherInfo.desc}</span>
                                    <span class="temp-highlow">
                                        <span class="max">↑${tempStr(highC)}</span>
                                        <span class="min">↓${tempStr(lowC)}</span>
                                    </span>
                                </div>
                            </div>
                        `;

                // ─── DETAILS ──────────────────────────────────────────────────
                const feelsLikeC = data.current.apparent_temperature !== undefined ? data.current.apparent_temperature : currentTempC;
                const humidity = data.current.relative_humidity_2m !== undefined ? data.current.relative_humidity_2m : '—';
                const pressure = data.current.pressure_msl !== undefined ? data.current.pressure_msl : '—';
                const windDir = data.current.wind_direction_10m !== undefined ? getWindDirection(data.current.wind_direction_10m) :
                    '—';
                const precip = data.current.precipitation !== undefined ? data.current.precipitation.toFixed(1) : '0.0';
                const uv = daily.uv_index_max[0] !== undefined ? daily.uv_index_max[0].toFixed(1) : '—';

                detailsContainer.innerHTML = `
                            <div class="details-grid">
                                <div class="detail-card"><div class="label">Feels Like</div><div class="value">${tempStr(feelsLikeC)}</div></div>
                                <div class="detail-card"><div class="label">Humidity</div><div class="value">${humidity}%</div></div>
                                <div class="detail-card"><div class="label">Wind</div><div class="value">${windSpeed} km/h</div><div class="sub">${windDir}</div></div>
                                <div class="detail-card"><div class="label">UV Index</div><div class="value">${uv}</div></div>
                                <div class="detail-card"><div class="label">Precipitation</div><div class="value">${precip} mm</div></div>
                                <div class="detail-card"><div class="label">Pressure</div><div class="value">${pressure} hPa</div></div>
                            </div>
                        `;

                // ─── SUNRISE ──────────────────────────────────────────────────
                const sunriseLocal = formatTimeOnly(sunriseStr, timezone);
                const sunsetLocal = formatTimeOnly(sunsetStr, timezone);
                sunriseContainer.innerHTML = `
                            <div class="sunrise-sunset">
                                <div class="item"><div class="label">🌅 Sunrise</div><div class="time">${sunriseLocal}</div></div>
                                <div class="item"><div class="label">🌇 Sunset</div><div class="time">${sunsetLocal}</div></div>
                            </div>
                        `;

                // ─── HOURLY with sunrise/sunset as markers BETWEEN hours ────
                const hourly = data.hourly;
                const hourlyTimes = hourly.time.map(t => {
                    return luxon.DateTime.fromISO(t, { zone: timezone }).toJSDate();
                });

                // Use luxon DateTime for accurate timezone-aware comparison
                const sunriseDT = luxon.DateTime.fromISO(sunriseStr, { zone: timezone });
                const sunsetDT = luxon.DateTime.fromISO(sunsetStr, { zone: timezone });

                let startIdx = hourlyTimes.findIndex(t => t >= nowLocal);
                if (startIdx === -1) startIdx = 0;
                const extraStart = Math.max(0, startIdx - 2);
                const endIdx = Math.min(hourlyTimes.length, extraStart + 28);

                const displayItems = [];
                let sunriseInserted = false;
                let sunsetInserted = false;

                for (let i = extraStart; i < endIdx; i++) {
                    const h = hourlyTimes[i];
                    const hourStart = luxon.DateTime.fromJSDate(h, { zone: timezone }).startOf('hour');
                    const hourEnd = hourStart.plus({ hours: 1 });

                    // Add the hour first
                    displayItems.push({
                        type: 'hour',
                        date: h,
                        index: i,
                        temp: hourly.temperature_2m[i],
                        code: hourly.weather_code[i],
                    });

                    // Check if sunrise falls within this hour (after pushing hour)
                    if (!sunriseInserted && sunriseDT >= hourStart && sunriseDT < hourEnd) {
                        displayItems.push({
                            type: 'sunrise',
                            date: sunriseDT.toJSDate(),
                            timeStr: formatTimeOnly(sunriseStr, timezone)
                        });
                        sunriseInserted = true;
                    }

                    // Check if sunset falls within this hour
                    if (!sunsetInserted && sunsetDT >= hourStart && sunsetDT < hourEnd) {
                        displayItems.push({
                            type: 'sunset',
                            date: sunsetDT.toJSDate(),
                            timeStr: formatTimeOnly(sunsetStr, timezone)
                        });
                        sunsetInserted = true;
                    }
                }

                // Sort by time to ensure correct order
                displayItems.sort((a, b) => a.date.getTime() - b.date.getTime());

                let hourlyHtml = `<div class="section-title">Hourly Forecast</div><div class="hourly-scroll">`;
                for (const item of displayItems) {
                    if (item.type === 'sunrise') {
                        hourlyHtml += `<div class="hourly-marker sunrise-marker">
                                    <div class="marker-line"></div>
                                    <div class="marker-icon">🌅</div>
                                    <div class="marker-time">${item.timeStr}</div>
                                </div>`;
                    } else if (item.type === 'sunset') {
                        hourlyHtml += `<div class="hourly-marker sunset-marker">
                                    <div class="marker-line"></div>
                                    <div class="marker-icon">🌇</div>
                                    <div class="marker-time">${item.timeStr}</div>
                                </div>`;
                    } else {
                        const h = item.date;
                        const hourLabel = h.getHours() === 0 ? '12 AM' : (h.getHours() < 12 ? h.getHours() + ' AM' : (h
                            .getHours() - 12) + ' PM');
                        const isDayHour = h >= sunrise && h <= sunset;
                        const info = getWeatherInfo(item.code, isDayHour);
                        const tempC = item.temp;
                        hourlyHtml += `<div class="hourly-item">
                                    <div class="hour">${hourLabel}</div>
                                    <div class="icon">${info.icon}</div>
                                    <div class="temp">${tempStr(tempC)}</div>
                                </div>`;
                    }
                }
                hourlyHtml += `</div>`;
                hourlyContainer.innerHTML = hourlyHtml;

                // ─── DAILY ────────────────────────────────────────────────────
                let dailyHtml = `<div class="section-title">10‑Day Forecast</div><div class="daily-list">`;
                for (let i = 0; i < Math.min(days, 10); i++) {
                    const date = luxon.DateTime.fromISO(daily.time[i], { zone: timezone }).toJSDate();
                    const dayName = i === 0 ? 'Today' : date.toLocaleDateString('en', { weekday: 'short' });
                    const dateStr = date.toLocaleDateString('en', { month: 'short', day: 'numeric' });
                    const maxC = daily.temperature_2m_max[i];
                    const minC = daily.temperature_2m_min[i];
                    const info = getWeatherInfo(daily.weather_code[i], true);
                    const icon = info.icon;
                    const precipChance = daily.precipitation_sum[i] !== undefined ? daily.precipitation_sum[i].toFixed(
                        0) : '0';
                    dailyHtml += `
                                <div class="daily-row">
                                    <div class="day">${dayName} ${dateStr}</div>
                                    <div class="icon">${icon}</div>
                                    <div class="temps"><span class="max">${tempStr(maxC)}</span><span class="min">${tempStr(minC)}</span></div>
                                    <div class="precip">${precipChance} mm</div>
                                </div>
                            `;
                }
                dailyHtml += `</div>`;
                dailyContainer.innerHTML = dailyHtml;

                setTimeout(() => {
                    loadLayout();
                    initLayoutEvents();
                    if (layoutMode) {
                        document.getElementById('sticky-header').style.position = 'static';
                        document.getElementById('sticky-header').style.backdropFilter = 'none';
                        document.getElementById('sticky-header').style.background = 'transparent';
                        document.getElementById('sticky-header').style.boxShadow = 'none';
                        document.getElementById('sticky-header').style.border = 'none';
                        document.getElementById('scrollable-content').style.overflowY = 'visible';
                        document.getElementById('scrollable-content').style.flex = 'none';
                        document.getElementById('scrollable-content').style.display = 'block';
                        // Show drag handles for merged display in layout mode
                        document.querySelectorAll('#merged-display .drag-handle, #merged-display .resize-handle')
                            .forEach(el => el.style.display = '');
                    } else {
                        document.getElementById('sticky-header').style.position = 'sticky';
                        document.getElementById('sticky-header').style.backdropFilter = 'none';
                        document.getElementById('sticky-header').style.background = 'transparent';
                        document.getElementById('sticky-header').style.boxShadow = 'none';
                        document.getElementById('sticky-header').style.border = '1px solid rgba(255, 255, 255, 0.06)';
                        document.getElementById('scrollable-content').style.overflowY = 'auto';
                        document.getElementById('scrollable-content').style.flex = '1';
                        document.getElementById('scrollable-content').style.display = 'flex';
                        // Hide drag handles for merged display in normal mode
                        document.querySelectorAll('#merged-display .drag-handle, #merged-display .resize-handle')
                            .forEach(el => el.style.display = 'none');
                    }
                    const canvas = document.getElementById('guide-canvas');
                    if (canvas) {
                        canvas.style.display = layoutMode ? 'block' : 'none';
                        const rect = dashboard.getBoundingClientRect();
                        canvas.width = rect.width;
                        canvas.height = rect.height;
                        canvas.style.width = rect.width + 'px';
                        canvas.style.height = rect.height + 'px';
                    }
                    const c = document.getElementById('weather-canvas');
                    const cont = document.getElementById('merged-display');
                    if (c && cont) {
                        const r = cont.getBoundingClientRect();
                        c.width = r.width || 640;
                        c.height = r.height || 800;
                        c.style.width = '100%';
                        c.style.height = '100%';
                    }
                }, 80);

            } catch (err) {
                console.error('Weather dashboard error:', err);
                headerContainer.innerHTML =
                    `<div class="loading-text" style="color: #f87171;">Failed to load weather.</div>`;
            }
        }

        // ─── Search ──────────────────────────────────────────────────────────
        function setupSearch() {
            const input = document.getElementById('location-search');
            const suggestions = document.getElementById('search-suggestions');

            input.addEventListener('input', function() {
                const query = this.value.trim();
                if (query.length < 2) {
                    suggestions.style.display = 'none';
                    return;
                }
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(async () => {
                    const results = await searchLocations(query);
                    if (results.length === 0) {
                        suggestions.innerHTML =
                            '<div class="suggestion-item" style="color:#aaa;">No results found</div>';
                        suggestions.style.display = 'block';
                        return;
                    }
                    suggestions.innerHTML = results.map(r =>
                        `<div class="suggestion-item" data-lat="${r.latitude}" data-lon="${r.longitude}" data-name="${r.display}">${r.display}</div>`
                    ).join('');
                    suggestions.style.display = 'block';
                    suggestions.querySelectorAll('.suggestion-item').forEach(el => {
                        el.addEventListener('click', function() {
                            const lat = parseFloat(this.dataset.lat);
                            const lon = parseFloat(this.dataset.lon);
                            const name = this.dataset.name;
                            input.value = name;
                            suggestions.style.display = 'none';
                            lastLocation = { lat, lon, name };
                            localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                            loadWeatherDashboard();
                            if (window.parent && window.parent !== window) {
                                try {
                                    window.parent.postMessage({ type: 'weather-location-update',
                                        location: lastLocation }, '*');
                                } catch (e) {}
                            }
                        });
                    });
                }, 300);
            });

            document.addEventListener('click', function(e) {
                if (!e.target.closest('#widget-search')) {
                    suggestions.style.display = 'none';
                }
            });

            document.getElementById('use-my-location-btn').addEventListener('click', function() {
                if (navigator.geolocation) {
                    navigator.geolocation.getCurrentPosition(
                        async (pos) => {
                            const { latitude, longitude } = pos.coords;
                            const name = await fetchLocationName(latitude, longitude);
                            lastLocation = { lat: latitude, lon: longitude, name };
                            localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                            loadWeatherDashboard();
                            document.getElementById('location-search').value = name;
                            suggestions.style.display = 'none';
                            if (window.parent && window.parent !== window) {
                                try {
                                    window.parent.postMessage({ type: 'weather-location-update',
                                        location: lastLocation }, '*');
                                } catch (e) {}
                            }
                        },
                        (err) => {
                            alert('Unable to get your location. Please check permissions.');
                        }, { enableHighAccuracy: true }
                    );
                } else {
                    alert('Geolocation not supported by your browser.');
                }
            });
        }

        // ─── Settings ──────────────────────────────────────────────────────
        function setupSettings() {
            const overlay = document.getElementById('settings-overlay');
            const openBtn = document.getElementById('settings-toggle-btn');

            const applyBtn = document.getElementById('settings-apply-btn');

            const tempUnit = document.getElementById('temp-unit');

            const cloudDensity = document.getElementById('cloud-density');
            const cloudSize = document.getElementById('cloud-size');
            const cloudSpeed = document.getElementById('cloud-speed');
            const cloudOpacity = document.getElementById('cloud-opacity');

            const rainSize = document.getElementById('rain-size');
            const rainFreq = document.getElementById('rain-freq');
            const rainSpeed = document.getElementById('rain-speed');

            const thunderIntensity = document.getElementById('thunder-intensity');
            const lightningFreq = document.getElementById('lightning-freq');
            const thunderRainSize = document.getElementById('thunder-rain-size');
            const thunderRainFreq = document.getElementById('thunder-rain-freq');

            const snowSize = document.getElementById('snow-size');
            const snowDensity = document.getElementById('snow-density');

            const snowWobble = document.getElementById('snow-wobble');

            const fogDensity = document.getElementById('fog-density');
            const fogSize = document.getElementById('fog-size');

            function readSettingsFromUI() {
                settings.tempUnit = tempUnit.value;
                settings.cloudDensity = parseFloat(cloudDensity.value) / 100;
                settings.cloudSize = parseFloat(cloudSize.value) / 100;
                settings.cloudSpeed = parseFloat(cloudSpeed.value) / 100;

                settings.thunderRainFreq = parseFloat(thunderRainFreq.value) / 100;
                settings.snowSize = parseFloat(snowSize.value) / 100;
                settings.snowDensity = parseFloat(snowDensity.value) / 100;
                settings.snowSpeed = parseFloat(snowSpeed.value) / 100;
                settings.snowWobble = parseFloat(snowWobble.value) / 100;
                settings.fogDensity = parseFloat(fogDensity.value) / 100;
                settings.fogSize = parseFloat(fogSize.value) / 100;
            }

            function writeSettingsToUI() {
                tempUnit.value = settings.tempUnit;
                cloudDensity.value = settings.cloudDensity * 100;
                cloudSize.value = settings.cloudSize * 100;
                cloudSpeed.value = settings.cloudSpeed * 100;
                cloudOpacity.value = settings.cloudOpacity * 100;
                rainSize.value = settings.rainSize * 100;
                rainFreq.value = settings.rainFreq * 100;
                rainSpeed.value = settings.rainSpeed * 100;
                thunderIntensity.value = settings.thunderIntensity * 100;
                lightningFreq.value = settings.lightningFreq * 100;
                thunderRainSize.value = settings.thunderRainSize * 100;
                thunderRainFreq.value = settings.thunderRainFreq * 100;
                snowSize.value = settings.snowSize * 100;
                snowDensity.value = settings.snowDensity * 100;
                snowSpeed.value = settings.snowSpeed * 100;
                snowWobble.value = settings.snowWobble * 100;
                fogDensity.value = settings.fogDensity * 100;
                fogSize.value = settings.fogSize * 100;
                updateAllLabels();
            }

            function updateAllLabels() {
                const cd = parseFloat(cloudDensity.value);
                document.getElementById('cloud-density-label').textContent = cd < 33 ? 'low' : cd < 66 ? 'medium' : 'high';
                const cs = parseFloat(cloudSize.value);
                document.getElementById('cloud-size-label').textContent = cs < 33 ? 'small' : cs < 66 ? 'medium' : 'large';
                const csp = parseFloat(cloudSpeed.value);
                document.getElementById('cloud-speed-label').textContent = csp < 33 ? 'slow' : csp < 66 ? 'medium' : 'fast';
                const co = parseFloat(cloudOpacity.value);
                document.getElementById('cloud-opacity-label').textContent = co < 33 ? 'light' : co < 66 ? 'medium' : 'dense';

                const rs = parseFloat(rainSize.value);
                document.getElementById('rain-size-label').textContent = rs < 33 ? 'small' : rs < 66 ? 'medium' : 'large';
                const rf = parseFloat(rainFreq.value);
                document.getElementById('rain-freq-label').textContent = rf < 33 ? 'low' : rf < 66 ? 'medium' : 'high';
                const rsp = parseFloat(rainSpeed.value);
                document.getElementById('rain-speed-label').textContent = rsp < 33 ? 'slow' : rsp < 66 ? 'medium' : 'fast';

                const ti = parseFloat(thunderIntensity.value);
                document.getElementById('thunder-intensity-label').textContent = ti < 33 ? 'mild' : ti < 66 ? 'medium' :
                    'severe';
                const lf = parseFloat(lightningFreq.value);
                document.getElementById('lightning-freq-label').textContent = lf < 33 ? 'rare' : lf < 66 ? 'medium' :
                    'frequent';
                const trs = parseFloat(thunderRainSize.value);
                document.getElementById('thunder-rain-size-label').textContent = trs < 33 ? 'small' : trs < 66 ? 'medium' :
                    'large';
                const trf = parseFloat(thunderRainFreq.value);
                document.getElementById('thunder-rain-freq-label').textContent = trf < 33 ? 'low' : trf < 66 ? 'medium' :
                    'high';

                const ss = parseFloat(snowSize.value);
                document.getElementById('snow-size-label').textContent = ss < 33 ? 'small' : ss < 66 ? 'medium' : 'large';
                const sd = parseFloat(snowDensity.value);
                document.getElementById('snow-density-label').textContent = sd < 33 ? 'light' : sd < 66 ? 'medium' : 'heavy';
                const ssp = parseFloat(snowSpeed.value);
                document.getElementById('snow-speed-label').textContent = ssp < 33 ? 'slow' : ssp < 66 ? 'medium' : 'fast';
                const sw = parseFloat(snowWobble.value);
                document.getElementById('snow-wobble-label').textContent = sw < 33 ? 'gentle' : sw < 66 ? 'moderate' :
                    'erratic';

                const fd = parseFloat(fogDensity.value);
                document.getElementById('fog-density-label').textContent = fd < 33 ? 'light' : fd < 66 ? 'medium' : 'thick';
                const fs = parseFloat(fogSize.value);
                document.getElementById('fog-size-label').textContent = fs < 33 ? 'small' : fs < 66 ? 'medium' : 'large';
            }

            function updateParamGroups(weatherCode) {
                const cat = getWeatherCategory(weatherCode);
                const groups = {
                    'clouds': 'param-group-cloud',
                    'rain': 'param-group-rain',
                    'thunderstorm': 'param-group-thunder',
                    'snow': 'param-group-snow',
                    'fog': 'param-group-fog',
                };
                document.querySelectorAll('.param-group').forEach(el => el.classList.remove('active'));
                if (groups[cat]) {
                    document.getElementById(groups[cat]).classList.add('active');
                }
                if (cat === 'rain') {
                    document.getElementById('param-group-rain').classList.add('active');
                }
            }

            function resetToDefaults() {
                Object.assign(settings, DEFAULT_SETTINGS);
                writeSettingsToUI();
                const code = parseInt(previewWeather.value);
                updatePreview(code, 5);
                const info = getWeatherInfo(code, true);
                document.getElementById('preview-weather-label').textContent = info.desc;
                updateParamGroups(code);
                localStorage.setItem('weatherSettings', JSON.stringify(settings));
            }

            function loadPresets() {
                const saved = localStorage.getItem('weatherPresets');
                if (saved) {
                    try {
                        presets = JSON.parse(saved);
                    } catch (e) { presets = {}; }
                } else {
                    presets = {};
                }
                renderPresetList();
            }

            function savePresets() {
                localStorage.setItem('weatherPresets', JSON.stringify(presets));
                renderPresetList();
            }

            function renderPresetList() {
                const names = Object.keys(presets);
                if (names.length === 0) {
                    presetList.innerHTML =
                        '<div style="padding:12px;text-align:center;opacity:0.4;font-size:0.85rem;">No presets saved</div>';
                    return;
                }
                presetList.innerHTML = names.map(name => `
                        <div class="preset-item" data-name="${name}">
                            <span class="preset-name">${name}</span>
                            <button class="preset-del" data-name="${name}">✕</button>
                        </div>
                    `).join('');

                presetList.querySelectorAll('.preset-item').forEach(el => {
                    el.addEventListener('click', function(e) {
                        if (e.target.classList.contains('preset-del')) return;
                        const name = this.dataset.name;
                        if (presets[name]) {
                            Object.assign(settings, presets[name]);
                            writeSettingsToUI();
                            const code = parseInt(previewWeather.value);
                            updatePreview(code, 5);
                            const info = getWeatherInfo(code, true);
                            document.getElementById('preview-weather-label').textContent = info.desc;
                            updateParamGroups(code);
                            document.querySelectorAll('.preset-item').forEach(p => p.classList.remove('active'));
                            this.classList.add('active');
                        }
                    });
                    el.querySelector('.preset-del').addEventListener('click', function(e) {
                        e.stopPropagation();
                        const name = this.dataset.name;
                        if (confirm(`Delete preset "${name}"?`)) {
                            delete presets[name];
                            savePresets();
                            renderPresetList();
                        }
                    });
                });
            }

            function saveCurrentPreset(name) {
                readSettingsFromUI();
                presets[name] = { ...settings };
                savePresets();
                renderPresetList();
                document.querySelectorAll('.preset-item').forEach(p => p.classList.remove('active'));
                const items = presetList.querySelectorAll('.preset-item');
                for (const item of items) {
                    if (item.dataset.name === name) {
                        item.classList.add('active');
                        break;
                    }
                }
            }

            previewBtn.addEventListener('click', function() {
                readSettingsFromUI();
                const code = parseInt(previewWeather.value);
                updatePreview(code, 5);
                const info = getWeatherInfo(code, true);
                document.getElementById('preview-weather-label').textContent = info.desc;
                updateParamGroups(code);
            });

            defaultBtn.addEventListener('click', function() {
                if (confirm('Reset all settings to default values?')) {
                    resetToDefaults();
                }
            });

            savePresetBtn.addEventListener('click', function() {
                presetModal.classList.add('open');
                presetModalInput.value = '';
                presetModalInput.focus();
            });

            presetModalConfirm.addEventListener('click', function() {
                const name = presetModalInput.value.trim();
                if (name) {
                    saveCurrentPreset(name);
                    presetModal.classList.remove('open');
                } else {
                    alert('Please enter a preset name.');
                }
            });

            presetModalCancel.addEventListener('click', function() {
                presetModal.classList.remove('open');
            });

            presetModal.addEventListener('click', function(e) {
                if (e.target === presetModal) {
                    presetModal.classList.remove('open');
                }
            });

            loadPresetBtn.addEventListener('click', function() {
                const container = presetListContainer;
                if (container.style.display === 'none') {
                    container.style.display = 'block';
                    loadPresets();
                    loadPresetBtn.textContent = '📂 Hide Presets';
                } else {
                    container.style.display = 'none';
                    loadPresetBtn.textContent = '📂 Load Preset';
                }
            });

            savePresetConfirm.addEventListener('click', function() {
                const name = presetNameInput.value.trim();
                if (name) {
                    saveCurrentPreset(name);
                    presetNameInput.value = '';
                } else {
                    alert('Please enter a preset name.');
                }
            });

            previewWeather.addEventListener('change', function() {
                const code = parseInt(this.value);
                updateParamGroups(code);
                readSettingsFromUI();
                updatePreview(code, 5);
                const info = getWeatherInfo(code, true);
                document.getElementById('preview-weather-label').textContent = info.desc;
            });

            applyBtn.addEventListener('click', function() {
                readSettingsFromUI();
                localStorage.setItem('weatherSettings', JSON.stringify(settings));
                if (weatherCache) {
                    loadWeatherDashboard();
                }
                overlay.classList.remove('open');
                stopPreview();
            });

            openBtn.addEventListener('click', function() {
                writeSettingsToUI();
                const code = parseInt(previewWeather.value);
                updateParamGroups(code);
                overlay.classList.add('open');
                updatePreview(code, 5);
                loadPresets();
                presetListContainer.style.display = 'none';
                loadPresetBtn.textContent = '📂 Load Preset';
            });

            closeBtn.addEventListener('click', function() {
                overlay.classList.remove('open');
                stopPreview();
                presetListContainer.style.display = 'none';
                loadPresetBtn.textContent = '📂 Load Preset';
            });

            overlay.addEventListener('click', function(e) {
                if (e.target === overlay) {
                    overlay.classList.remove('open');
                    stopPreview();
                    presetListContainer.style.display = 'none';
                    loadPresetBtn.textContent = '📂 Load Preset';
                }
            });

            layoutToggleBtn.addEventListener('click', function() {
                toggleLayoutMode();
                overlay.classList.remove('open');
            });

            resetLayoutBtn.addEventListener('click', function() {
                if (confirm('Reset widget layout to default?')) {
                    resetLayout();
                }
            });

            snapToggleBtn.addEventListener('click', function() {
                snapEnabled = !snapEnabled;
                this.textContent = snapEnabled ? '🧲 Snap: ON' : '🧲 Snap: OFF';
                this.style.background = snapEnabled ? 'rgba(74,220,255,0.2)' : 'rgba(100,100,100,0.2)';
            });

            pushToggleBtn.addEventListener('click', function() {
                pushEnabled = !pushEnabled;
                this.textContent = pushEnabled ? '📦 Push: ON' : '📦 Push: OFF';
                this.style.background = pushEnabled ? 'rgba(255,200,80,0.2)' : 'rgba(100,100,100,0.2)';
            });

            guidesToggleBtn.addEventListener('click', function() {
                guidesEnabled = !guidesEnabled;
                this.textContent = guidesEnabled ? '📐 Guides: ON' : '📐 Guides: OFF';
                this.style.background = guidesEnabled ? 'rgba(74,158,255,0.2)' : 'rgba(100,100,100,0.2)';
                if (!guidesEnabled) {
                    const canvas = document.getElementById('guide-canvas');
                    if (canvas) {
                        const ctx = canvas.getContext('2d');
                        ctx.clearRect(0, 0, canvas.width, canvas.height);
                    }
                } else {
                    const container = document.getElementById('weather-dashboard-container');
                    drawGuides(null, container);
                }
            });

            const sliders = [cloudDensity, cloudSize, cloudSpeed, cloudOpacity,
                rainSize, rainFreq, rainSpeed,
                thunderIntensity, lightningFreq, thunderRainSize, thunderRainFreq,
                snowSize, snowDensity, snowSpeed, snowWobble,
                fogDensity, fogSize
            ];
            sliders.forEach(el => {
                el.addEventListener('input', function() {
                    readSettingsFromUI();
                    updateAllLabels();
                    if (previewTimeout) clearTimeout(previewTimeout);
                    previewTimeout = setTimeout(() => {
                        const code = parseInt(previewWeather.value);
                        updatePreview(code, 5);
                    }, 100);
                });
            });

            tempUnit.addEventListener('change', function() {
                readSettingsFromUI();
                const code = parseInt(previewWeather.value);
                updatePreview(code, 5);
            });

            updateAllLabels();
            const saved = localStorage.getItem('weatherSettings');
            if (saved) {
                try {
                    const parsed = JSON.parse(saved);
                    Object.assign(settings, parsed);
                } catch (e) {}
            }
            writeSettingsToUI();
            loadPresets();
        }

        // ─── Init ────────────────────────────────────────────────────────────
        function initWeather() {
            const saved = localStorage.getItem('weatherSettings');
            if (saved) {
                try {
                    Object.assign(settings, JSON.parse(saved));
                } catch (e) {}
            }

            const urlParams = new URLSearchParams(window.location.search);
            const latParam = urlParams.get('lat');
            const lonParam = urlParams.get('lon');
            const nameParam = urlParams.get('name');

            // Highest priority: URL parameters (shared links)
            if (latParam && lonParam && nameParam) {
                lastLocation = {
                    lat: parseFloat(latParam),
                    lon: parseFloat(lonParam),
                    name: nameParam
                };
                localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                loadWeatherDashboard();
                document.getElementById('location-search').value = nameParam;
                return;
            }

            // Second priority: Current location (Geolocation) - ALWAYS try this first
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    async (pos) => {
                        const { latitude, longitude } = pos.coords;
                        const name = await fetchLocationName(latitude, longitude);
                        lastLocation = { lat: latitude, lon: longitude, name };
                        localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                        loadWeatherDashboard();
                        document.getElementById('location-search').value = name;
                    },
                    (err) => {
                        console.warn('Geolocation error, falling back to saved or default:', err);
                        // Third priority: localStorage
                        const stored = localStorage.getItem('selectedLocation');
                        if (stored) {
                            try {
                                const parsed = JSON.parse(stored);
                                if (parsed.lat && parsed.lon && parsed.name) {
                                    lastLocation = parsed;
                                    loadWeatherDashboard();
                                    document.getElementById('location-search').value = parsed.name;
                                    return;
                                }
                            } catch (e) {}
                        }
                        // Fourth priority: Fallback
                        const fallbackLat = 29.3759,
                            fallbackLon = 47.9774;
                        fetchLocationName(fallbackLat, fallbackLon).then(name => {
                            lastLocation = { lat: fallbackLat, lon: fallbackLon, name };
                            localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                            loadWeatherDashboard();
                            document.getElementById('location-search').value = name;
                        });
                    }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 600000 }
                );
            } else {
                // Geolocation not supported, fallback to localStorage or default
                const stored = localStorage.getItem('selectedLocation');
                if (stored) {
                    try {
                        const parsed = JSON.parse(stored);
                        if (parsed.lat && parsed.lon && parsed.name) {
                            lastLocation = parsed;
                            loadWeatherDashboard();
                            document.getElementById('location-search').value = parsed.name;
                            return;
                        }
                    } catch (e) {}
                }
                const fallbackLat = 29.3759,
                    fallbackLon = 47.9774;
                fetchLocationName(fallbackLat, fallbackLon).then(name => {
                    lastLocation = { lat: fallbackLat, lon: fallbackLon, name };
                    localStorage.setItem('selectedLocation', JSON.stringify(lastLocation));
                    loadWeatherDashboard();
                    document.getElementById('location-search').value = name;
                });
            }
        }

        document.getElementById('close-weather-btn').addEventListener('click', function() {
            if (window.parent && window.parent !== window) {
                try {
                    window.parent.postMessage({ type: 'close-weather' }, '*');
                } catch (e) {}
            } else {
                if (window.history.length > 1) window.history.back();
                else window.close();
            }
        });

        document.getElementById('layout-toggle-btn').addEventListener('click', function(e) {
            e.stopPropagation();
            toggleLayoutMode();
        });

        window.addEventListener('message', function(e) {
            if (e.data && e.data.type === 'update-location') {
                const loc = e.data.location;
                if (loc && loc.lat && loc.lon && loc.name) {
                    lastLocation = loc;
                    localStorage.setItem('selectedLocation', JSON.stringify(loc));
                    loadWeatherDashboard();
                    document.getElementById('location-search').value = loc.name;
                }
            }
        });

        document.addEventListener('DOMContentLoaded', function() {
            setupSearch();
            setupSettings();
            initWeather();

            window.addEventListener('resize', function() {
                const canvas = document.getElementById('guide-canvas');
                if (canvas && layoutMode) {
                    const container = document.getElementById('weather-dashboard-container');
                    const rect = container.getBoundingClientRect();
                    canvas.width = rect.width;
                    canvas.height = rect.height;
                    canvas.style.width = rect.width + 'px';
                    canvas.style.height = rect.height + 'px';
                    drawGuides(null, container);
                }
                const wc = document.getElementById('weather-canvas');
                const cw = document.getElementById('merged-display');
                if (wc && cw && weatherCache) {
                    const rect = cw.getBoundingClientRect();
                    wc.width = rect.width || 640;
                    wc.height = rect.height || 800;
                    wc.style.width = '100%';
                    wc.style.height = '100%';
                }
            });

            setInterval(() => {
                if (weatherCache) {
                    const timezone = weatherCache.timezone || 'UTC';
                    const now = new Date();
                    const localTime = new Date(now.toLocaleString('en-US', { timeZone: timezone }));
                    const sunrise = new Date(weatherCache.daily.sunrise[0]);
                    const sunset = new Date(weatherCache.daily.sunset[0]);
                    const timeOfDay = getTimeOfDay(sunrise, sunset, localTime);
                    const dashboard = document.getElementById('weather-dashboard-container');
                    if (dashboard.getAttribute('data-time') !== timeOfDay) {
                        dashboard.setAttribute('data-time', timeOfDay);
                        let code = weatherCache.current.weather_code;
                        let wind = weatherCache.current.wind_speed_10m || 0;
                        stopWeatherAnimation();
                        startWeatherAnimation(code, wind, timeOfDay, settings);
                    }
                }
            }, 300000);
        });
    </script>
